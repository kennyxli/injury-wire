<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waiver Wire — Live NFL Injury Report</title>
<style>
  :root{
    --bg:#0a0e14; --card:#131a24; --card2:#182130; --text:#eef2f7; --muted:#8b98ab;
    --green:#22c55e; --yellow:#eab308; --orange:#f97316; --red:#ef4444; --blue:#38bdf8;
    --accent:#a78bfa;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);}
  header{position:sticky; top:0; z-index:10; background:rgba(10,14,20,.92);
    backdrop-filter:blur(12px); border-bottom:1px solid #1e293b; padding:12px 16px;}
  header h1{margin:0; font-size:20px; letter-spacing:.5px;}
  header h1 span{color:var(--accent);}
  .sub{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--muted);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .tabs{display:flex; gap:8px; padding:12px 16px 0; overflow-x:auto;}
  .tab{flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--card);
    border:1px solid #243044; color:var(--muted); font-size:13px; font-weight:600;}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#0a0e14;}
  .section{padding:12px 16px;}
  .section h2{font-size:14px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:8px 0 10px;}
  .card{background:var(--card); border:1px solid #1e293b; border-radius:14px; padding:14px; margin-bottom:10px;}
  .card.new{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .row1{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .pname{font-size:16px; font-weight:700;}
  .pmeta{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{flex:0 0 auto; font-size:11px; font-weight:800; padding:5px 10px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.5px;}
  .b-Q{ background:rgba(234,179,8,.15); color:var(--yellow); border:1px solid var(--yellow);}
  .b-D{ background:rgba(249,115,22,.15); color:var(--orange); border:1px solid var(--orange);}
  .b-O{ background:rgba(239,68,68,.15); color:var(--red); border:1px solid var(--red);}
  .b-IR{ background:rgba(239,68,68,.28); color:#fff; border:1px solid var(--red);}
  .b-PUP{ background:rgba(239,68,68,.28); color:#fff; border:1px solid var(--red);}
  .b-SUS{ background:rgba(139,152,171,.15); color:var(--muted); border:1px solid var(--muted);}
  .inj{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.45;}
  .waiver{margin-top:10px; background:var(--card2); border:1px dashed var(--accent);
    border-radius:10px; padding:10px 12px;}
  .waiver .wl{font-size:11px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:1px;}
  .waiver .wp{font-size:14px; font-weight:700; margin-top:4px;}
  .waiver .wn{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45;}
  .change{font-size:12px; color:var(--muted); padding:10px 14px; border-left:2px solid var(--accent);
    background:var(--card); border-radius:0 10px 10px 0; margin-bottom:8px;}
  .change b{color:var(--text);}
  .change time{color:var(--accent); font-weight:600;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px;}
  .refresh{display:block; width:calc(100% - 32px); margin:4px 16px 16px; padding:12px;
    background:var(--card); color:var(--text); border:1px solid #2a3a52; border-radius:12px;
    font-size:14px; font-weight:700;}
  footer{color:var(--muted); font-size:11px; text-align:center; padding:8px 24px 32px; line-height:1.5;}
  .search{margin:12px 16px 0; width:calc(100% - 32px); padding:11px 14px; border-radius:12px;
    border:1px solid #243044; background:var(--card); color:var(--text); font-size:14px;}
  .trend{display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px solid #1a2332; font-size:14px;}
  .trend:last-child{border-bottom:none;}
  .trend .adds{color:var(--green); font-weight:700; font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>WAIVER<span>WIRE</span></h1>
  <div class="sub"><span class="dot"></span><span id="status">Connecting…</span></div>
</header>

<input class="search" id="search" type="search" placeholder="Search player…" autocomplete="off">

<div class="tabs" id="tabs">
  <button class="tab active" data-f="CHANGES">⚡ Latest</button>
  <button class="tab" data-f="ALL">All</button>
  <button class="tab" data-f="QB">QB</button>
  <button class="tab" data-f="RB">RB</button>
  <button class="tab" data-f="WR">WR</button>
  <button class="tab" data-f="TE">TE</button>
  <button class="tab" data-f="TRENDING">🔥 Trending</button>
</div>

<button class="refresh" id="refreshBtn">⟳ Pull latest now</button>

<div class="section" id="list"></div>

<footer>
  Injury data: Sleeper API · Refreshes automatically<br>
  Waiver notes are a starting point — always check your league's availability.<br>
  Not affiliated with the NFL, Sleeper, or Underdog.
</footer>

<script>
"use strict";
/* ============ WEEK CONTEXT ============ */
// NFL week derived from season start (2026 Week 1 Thursday = Sept 10)
const SEASON_START = new Date("2026-09-10T00:00:00").getTime();
const WEEK_NUM = Math.max(1, Math.min(18, Math.floor((Date.now() - SEASON_START) / (7*24*3600*1000)) + 1));

/* Curated: the injuries that actually matter THIS week.
   Updated by Brio via site pushes. Keep tight: only new/changed this week. */
const WEEK_STORIES = [
  { name:"Saquon Barkley", team:"PHI", pos:"RB", status:"Out",
    note:"Hamstring — week-to-week, expected to sit Week 5 in London. Will Shipley starts." },
  { name:"Tank Bigsby", team:"PHI", pos:"RB", status:"IR",
    note:"Core-muscle surgery, ~6 weeks on IR. Eagles backfield is Shipley alone." },
  { name:"Alvin Kamara", team:"NO", pos:"RB", status:"Questionable",
    note:"Limped off on MNF vs Falcons (3rd Q, no helmet return). Diagnosis pending — Kendre Miller next man up." },
  { name:"Ladd McConkey", team:"LAC", pos:"WR", status:"Questionable",
    note:"Foot — week-to-week since leaving the Week 4 game early with 0 catches." },
  { name:"Tyquan Thornton", team:"KC", pos:"WR", status:"IR",
    note:"Ankle surgery, out 12–16 weeks. Chiefs down a deep threat." },
];

/* ============ CONFIG ============ */
const POLL_MS = 90_000;               // re-check every 90s
const POSITIONS = ["QB","RB","WR","TE"];
const SKIP_STATUS = new Set(["", null, undefined]);

/* Handcuff / beneficiary map: injured star -> waiver target.
   Keyed by lowercase full name. EVERY entry verified against 2026-27
   depth charts on 2026-10-06. Rebuild (don't patch) when rosters shift. */
const WAIVER_MAP = {
  "saquon barkley":   { pickup:"Will Shipley", note:"Last healthy Eagles back with Barkley week-to-week (hamstring) and Bigsby on IR after core-muscle surgery. Real pass-catching role." },
  "tank bigsby":      { pickup:"Will Shipley", note:"Bigsby needs core-muscle surgery (~6 weeks on IR). Shipley is the last man standing in Philly." },
  "alvin kamara":     { pickup:"Kendre Miller", note:"In line for the lead-back role with Kamara banged up and Etienne on IR. CJ Donaldson is the deep stash." },
  "travis etienne":   { pickup:"Kendre Miller", note:"Etienne on IR (hamstring, min. 4 games) in New Orleans. Miller leads the backfield with Kamara also hurt." },
  "jeremiyah love":   { pickup:"Tyler Allgeier", note:"Veteran RB2 who led Arizona's backfield in snaps Weeks 1-2. Lead back if the rookie sits." },
  "josh jacobs":      { pickup:"MarShawn Lloyd", note:"Nominal GB RB2 all season; rookie Kaleb Johnson also in the mix per ESPN — Lloyd is the safe add, Johnson the upside swing." },
  "breece hall":      { pickup:"Braelon Allen", note:"Takes over the Jets' lead-back role. Isaiah Davis behind him." },
  "de'von achane":    { pickup:"Jaylen Wright", note:"Lead back with Achane done for the year (knee). Ollie Gordon II behind him." },
  "rico dowdle":      { pickup:"Travis Homer", note:"Pittsburgh's RB2 behind Jaylen Warren with Dowdle out (toe)." },
  "rachaad white":    { pickup:"Kaytron Allen", note:"Next up in Washington behind Jacory Croskey-Merritt with White out." },
  "isiah pacheco":    { pickup:"Sione Vaki", note:"Next healthy back behind Jahmyr Gibbs in Detroit (Pacheco on IR). Jacob Saylors is RB4." },
  "kyle monangai":    { pickup:"Roschon Johnson", note:"Absorbs short-yardage and goal-line work in Chicago if Monangai sits; Swift gets more volume." },
  "ja'marr chase":    { pickup:"Dohnte Meyers", note:"Cincinnati's WR3 with a huge role — Chase is out, Higgins is questionable, Iosivas is on IR." },
  "tee higgins":      { pickup:"Dohnte Meyers", note:"Would start for Cincinnati if Higgins sits. Already has a real role." },
  "a.j. brown":       { pickup:"Romeo Doubs", note:"$68M free-agent signing steps into New England's WR1 role. Mack Hollins is the red-zone veteran behind him." },
  "justin jefferson": { pickup:"Jordan Addison", note:"Takes over as Minnesota's lead receiver with Jefferson out (ankle). Jauan Jennings is WR3." },
  "ladd mcconkey":    { pickup:"Tre Harris", note:"Still on the Chargers as WR3 — steps into a starting role next to Quentin Johnston with McConkey out (foot)." },
  "dj moore":         { pickup:"Joshua Palmer", note:"Listed directly behind Moore in Buffalo; becomes WR3 with starter snaps if Moore sits." },
  "devonta smith":    { pickup:"Hollywood Brown", note:"Listed directly behind Smith on Philadelphia's depth chart. Makai Lemon gets a bump in 3-WR sets." },
  "rashee rice":      { pickup:"Jalen Royals", note:"Next man up in Kansas City behind Rice (Thornton is also hurt). Worthy already starts." },
  "terry mclaurin":   { pickup:"Dyami Brown", note:"Listed directly behind McLaurin at X receiver in Washington. Stefon Diggs also on the roster." },
  "jayden reed":      { pickup:"Bo Melton", note:"Listed directly behind Reed at WR2 in Green Bay; rookie Matthew Golden also gets a bump." },
  "keenan allen":     { pickup:"Josh Downs", note:"Clear-cut WR1 for Indianapolis with Allen out. Newly signed Darius Slayton is the riser behind him." },
  "alec pierce":      { pickup:"Josh Downs", note:"Already the target leader with Pierce on IR." },
  "caleb douglas":    { pickup:"Ryan Miller", note:"Listed as Douglas's direct backup on Miami's official depth chart." },
  "jayden higgins":   { pickup:"Xavier Hutchinson", note:"Starting WR for Houston with Higgins done (torn ACL). Jaylin Noel also absorbs snaps." },
  "tank dell":        { pickup:"Xavier Hutchinson", note:"Same — Dell remains on IR." },
  "jalen mcmillan":   { pickup:"Ted Hurst III", note:"Rookie cited as the biggest beneficiary of McMillan's IR stint (PCL sprain, 6-8 weeks)." },
  "lamar jackson":    { pickup:"Tyler Huntley", note:"Re-signed 2yr/$5M as Baltimore's backup; in line for his 12th career Ravens start." },
  "jayden daniels":   { pickup:"Marcus Mariota", note:"Veteran backup; his rushing keeps Washington's scheme functional." },
  "caleb williams":   { pickup:"Tyson Bagent", note:"Expected to start with Williams out (hamstring). Case Keenum is QB3." },
  "jaxson dart":      { pickup:"Jameis Winston", note:"Already named the Giants' starter for the rest of the season (Dart: season-ending knee surgery)." },
  "baker mayfield":   { pickup:"Jalon Daniels", note:"UDFA rookie named Tampa's Week 4 starter with Mayfield out (dislocated thumb, multi-week)." },
  "david njoku":      { pickup:"Oronde Gadsden", note:"The healthy pass-catching TE for the Chargers with Njoku on IR and Kolar doubtful." },
  "dallas goedert":   { pickup:"Zach Ertz", note:"Re-signed with Philadelphia and listed as TE2. Veteran who knows the offense." },
  "mason taylor":     { pickup:"Kenyon Sadiq", note:"Already starting as the Jets' TE1 — every-down role in a TE-friendly offense." },
};

/* ============ STATE ============ */
let players = {};          // id -> normalized
let prevStatus = {};       // id -> injury_status (for change detection)
let changes = [];          // {t, name, team, pos, from, to}
let trending = [];
let filter = "CHANGES", query = "";
try { prevStatus = JSON.parse(localStorage.getItem("ww_prev") || "{}"); } catch(e){}

const $ = id => document.getElementById(id);
const listEl = $("list"), statusEl = $("status");

function normName(n){ return (n||"").toLowerCase().trim(); }
function badgeClass(s){
  s = (s||"").toUpperCase();
  if (s.includes("QUESTIONABLE")) return "b-Q";
  if (s.includes("DOUBTFUL")) return "b-D";
  if (s === "OUT") return "b-O";
  if (s.includes("IR") || s.includes("INJURED RESERVE")) return "b-IR";
  if (s.includes("PUP")) return "b-PUP";
  if (s.includes("SUS")) return "b-SUS";
  return "b-Q";
}
function shortStatus(s){
  s=(s||"").toUpperCase();
  if(s.includes("QUESTIONABLE")) return "Q";
  if(s.includes("DOUBTFUL")) return "D";
  if(s==="OUT") return "OUT";
  if(s.includes("IR")) return "IR";
  if(s.includes("PUP")) return "PUP";
  return s.slice(0,12);
}
function timeAgo(t){
  const s = Math.floor((Date.now()-t)/1000);
  if (s < 60) return s+"s ago";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  return Math.floor(s/3600)+"h ago";
}
function relevance(p){
  // lower search_rank = more relevant; unranked go last
  return (p.search_rank && p.search_rank > 0) ? p.search_rank : 99999;
}

async function fetchPlayers(){
  const r = await fetch("https://api.sleeper.app/v1/players/nfl");
  if (!r.ok) throw new Error("players fetch failed");
  return r.json();
}
async function fetchTrending(){
  try{
    const r = await fetch("https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=15");
    if (!r.ok) return [];
    return r.json();
  }catch(e){ return []; }
}

function detectChanges(next){
  const now = Date.now();
  for (const id in next){
    const p = next[id];
    const prev = prevStatus[id];
    if (prev !== undefined && prev !== p.status){
      changes.unshift({ t: now, name: p.name, team: p.team, pos: p.pos,
        from: prev || "Healthy", to: p.status || "Healthy", id });
      if (changes.length > 60) changes.pop();
    }
  }
  prevStatus = {};
  for (const id in next) prevStatus[id] = next[id].status;
  try{ localStorage.setItem("ww_prev", JSON.stringify(prevStatus)); }catch(e){}
}

function waiverFor(p){
  const w = WAIVER_MAP[normName(p.name)];
  if (!w) return "";
  return `<div class="waiver"><div class="wl">⚡ Waiver target</div>
    <div class="wp">${esc(w.pickup)}</div>
    <div class="wn">${esc(w.note)}</div></div>`;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const q = query.toLowerCase();
  let html = "";
  if (filter === "CHANGES"){
    html += `<h2>🗓️ This week — Week ${WEEK_NUM}</h2>`;
    const wq = query.toLowerCase();
    const stories = WEEK_STORIES.filter(s => !wq || s.name.toLowerCase().includes(wq));
    html += stories.length ? stories.map(s=>{
      const w = WAIVER_MAP[normName(s.name)];
      return `<div class="card">
        <div class="row1"><div><div class="pname">${esc(s.name)}</div>
        <div class="pmeta">${esc(s.pos)} · ${esc(s.team)}</div></div>
        <span class="badge ${badgeClass(s.status)}">${esc(shortStatus(s.status))}</span></div>
        <div class="inj">${esc(s.note)}</div>
        ${w?`<div class="waiver"><div class="wl">⚡ Waiver target</div>
          <div class="wp">${esc(w.pickup)}</div>
          <div class="wn">${esc(w.note)}</div></div>`:""}</div>`;
    }).join("") : `<div class="empty">No week-specific stories yet.</div>`;
    html += "<h2>⚡ Live status changes</h2>";
    const items = changes.filter(c => !wq || c.name.toLowerCase().includes(wq)).slice(0,40);
    html += items.length ? items.map(c=>
      `<div class="change"><b>${esc(c.name)}</b> <span style="color:var(--muted)">${esc(c.pos)} · ${esc(c.team||"")}</span><br>
       ${esc(c.from)} → <b>${esc(c.to)}</b> · <time>${timeAgo(c.t)}</time></div>`
    ).join("") : `<div class="empty">No live changes detected yet.<br>Keep this page open — updates land automatically.</div>`;
  } else if (filter === "TRENDING"){
    html += "<h2>🔥 Most-added players (24h)</h2><div class='card'>";
    const items = trending.filter(t=>{
      const p = players[t.player_id];
      return p && (!q || p.name.toLowerCase().includes(q));
    });
    html += items.length ? items.map(t=>{
      const p = players[t.player_id];
      return `<div class="trend"><span><b>${esc(p.name)}</b> <span style="color:var(--muted);font-size:12px">${esc(p.pos)} · ${esc(p.team||"FA")}</span></span><span class="adds">+${Number(t.count).toLocaleString()}</span></div>`;
    }).join("") : `<div class="empty">Loading trending…</div>`;
    html += "</div>";
  } else {
    let arr = Object.values(players).filter(p =>
      POSITIONS.includes(p.pos) && p.status && !SKIP_STATUS.has(p.status));
    if (filter !== "ALL") arr = arr.filter(p => p.pos === filter);
    if (q) arr = arr.filter(p => p.name.toLowerCase().includes(q));
    arr.sort((a,b)=> relevance(a)-relevance(b));
    const bad = arr.filter(p=>["OUT","IR","PUP","DOUBTFUL"].some(k=>p.status.toUpperCase().includes(k)));
    const ques = arr.filter(p=>p.status.toUpperCase().includes("QUESTIONABLE"));
    const other = arr.filter(p=>!bad.includes(p)&&!ques.includes(p));
    const groups = [["⛔ Out / IR / Doubtful",bad],["❓ Questionable",ques],["ℹ️ Other",other]];
    for (const [title, g] of groups){
      if (!g.length) continue;
      html += `<h2>${title} (${g.length})</h2>`;
      html += g.slice(0,80).map(p=>{
        const isNew = changes.length && changes[0].id && String(changes[0].id)===String(p.id) &&
          (Date.now()-changes[0].t) < 10*60*1000;
        return `<div class="card${isNew?" new":""}">
          <div class="row1"><div><div class="pname">${esc(p.name)}</div>
          <div class="pmeta">${esc(p.pos)} · ${esc(p.team||"FA")}${p.injury_part? " · "+esc(p.injury_part):""}</div></div>
          <span class="badge ${badgeClass(p.status)}">${esc(shortStatus(p.status))}</span></div>
          ${p.injury_notes?`<div class="inj">${esc(p.injury_notes)}</div>`:""}
          ${waiverFor(p)}</div>`;
      }).join("");
    }
    if (!arr.length) html = `<div class="empty">No injuries match. 🎉</div>`;
  }
  listEl.innerHTML = html;
}

let lastOk = 0;
async function refresh(manual){
  try{
    if (manual) statusEl.textContent = "Pulling latest…";
    const [pd, tr] = await Promise.all([fetchPlayers(), fetchTrending()]);
    const next = {};
    for (const id in pd){
      const p = pd[id];
      if (!p || !POSITIONS.includes(p.position)) continue;
      next[id] = { id, name: p.full_name || (p.first_name+" "+p.last_name),
        pos: p.position, team: p.team || "", status: p.injury_status || "",
        injury_part: p.injury_body_part || "", injury_notes: p.injury_notes || "",
        search_rank: p.search_rank || 99999 };
    }
    detectChanges(next);
    players = next; trending = tr || [];
    lastOk = Date.now();
    statusEl.innerHTML = `<span class="dot"></span> Live · updated ${timeAgo(lastOk)} · checks every 90s`;
    render();
  }catch(e){
    statusEl.textContent = lastOk ? `Live · last good update ${timeAgo(lastOk)} · retrying…`
                                  : "Couldn't reach injury feed — retrying…";
  }
}

$("tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  b.classList.add("active"); filter = b.dataset.f; render();
});
$("search").addEventListener("input", e=>{ query = e.target.value; render(); });
$("refreshBtn").addEventListener("click", ()=>refresh(true));
setInterval(()=>refresh(false), POLL_MS);
setInterval(()=>{ // keep "xm ago" labels fresh
  if (lastOk) statusEl.innerHTML = `<span class="dot"></span> Live · updated ${timeAgo(lastOk)} · checks every 90s`;
}, 15000);
refresh(false);
</script>
</body>
</html>
