<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waiver Wire">
<meta name="theme-color" content="#0a0e14">
<link rel="apple-touch-icon" href="icon.png">
<title>Waiver Wire — Live NFL Injury Report</title>
<style>
  :root{
    --bg:#0a0e14; --card:#131a24; --card2:#182130; --text:#eef2f7; --muted:#8b98ab;
    --green:#22c55e; --yellow:#eab308; --orange:#f97316; --red:#ef4444; --blue:#38bdf8;
    --accent:#a78bfa;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);}
  header{position:sticky; top:0; z-index:10; background:rgba(10,14,20,.92);
    backdrop-filter:blur(12px); border-bottom:1px solid #1e293b; padding:12px 16px;}
  header h1{margin:0; font-size:20px; letter-spacing:.5px;}
  header h1 span{color:var(--accent);}
  .sub{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--muted);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .tabs{display:flex; gap:8px; padding:12px 16px 0; overflow-x:auto;}
  .tab{flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--card);
    border:1px solid #243044; color:var(--muted); font-size:13px; font-weight:600;}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#0a0e14;}
  .section{padding:12px 16px;}
  .section h2{font-size:14px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:8px 0 10px;}
  .card{background:var(--card); border:1px solid #1e293b; border-radius:14px; padding:14px; margin-bottom:10px;}
  .card.new{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .row1{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .pname{font-size:16px; font-weight:700;}
  .pmeta{font-size:12px; color:var(--muted); margin-top:2px;}
  .badge{flex:0 0 auto; font-size:11px; font-weight:800; padding:5px 10px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.5px;}
  .hidebtn{flex:0 0 auto; background:none; border:none; color:var(--red); font-size:20px;
    font-weight:700; cursor:pointer; padding:8px 6px; opacity:.85;}
  .hidebtn:active{opacity:1; transform:scale(1.25);}
  .b-Q{ background:rgba(234,179,8,.15); color:var(--yellow); border:1px solid var(--yellow);}
  .b-D{ background:rgba(249,115,22,.15); color:var(--orange); border:1px solid var(--orange);}
  .b-O{ background:rgba(239,68,68,.15); color:var(--red); border:1px solid var(--red);}
  .b-IR{ background:rgba(239,68,68,.28); color:#fff; border:1px solid var(--red);}
  .b-PUP{ background:rgba(239,68,68,.28); color:#fff; border:1px solid var(--red);}
  .b-SUS{ background:rgba(139,152,171,.15); color:var(--muted); border:1px solid var(--muted);}
  .inj{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.45;}
  .waiver{margin-top:10px; background:var(--card2); border:1px dashed var(--accent);
    border-radius:10px; padding:10px 12px;}
  .waiver .wl{font-size:11px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:1px;}
  .waiver .wp{font-size:14px; font-weight:700; margin-top:4px;}
  .waiver .wn{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.45;}
  .change{font-size:12px; color:var(--muted); padding:10px 14px; border-left:2px solid var(--accent);
    background:var(--card); border-radius:0 10px 10px 0; margin-bottom:8px;}
  .change b{color:var(--text);}
  .change time{color:var(--accent); font-weight:600;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:24px;}
  .refresh{display:block; width:calc(100% - 32px); margin:4px 16px 16px; padding:12px;
    background:var(--card); color:var(--text); border:1px solid #2a3a52; border-radius:12px;
    font-size:14px; font-weight:700;}
  footer{color:var(--muted); font-size:11px; text-align:center; padding:8px 24px 32px; line-height:1.5;}
  .search{margin:12px 16px 0; width:calc(100% - 32px); padding:11px 14px; border-radius:12px;
    border:1px solid #243044; background:var(--card); color:var(--text); font-size:14px;}
  .trend{display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px solid #1a2332; font-size:14px;}
  .trend:last-child{border-bottom:none;}
  .trend .adds{color:var(--green); font-weight:700; font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>WAIVER<span>WIRE</span></h1>
  <div class="sub"><span class="dot"></span><span id="status">Connecting…</span></div>
</header>

<input class="search" id="search" type="search" placeholder="Search player…" autocomplete="off">

<div class="tabs" id="tabs">
  <button class="tab active" data-f="TRENDING">🎯 Waivers</button>
  <button class="tab" data-f="CHANGES">⚡ Latest</button>
  <button class="tab" data-f="ALL">All</button>
  <button class="tab" data-f="QB">QB</button>
  <button class="tab" data-f="RB">RB</button>
  <button class="tab" data-f="WR">WR</button>
  <button class="tab" data-f="TE">TE</button>
</div>

<button class="refresh" id="refreshBtn">⟳ Pull latest now</button>
<button class="refresh" id="yahooBtn" style="display:none">🔗 Connect Yahoo</button>

<div class="section" id="list"></div>

<footer>
  Injury data: Sleeper API · Refreshes automatically<br>
  Waiver notes are a starting point — always check your league's availability.<br>
  Not affiliated with the NFL, Sleeper, or Underdog.
</footer>

<script>
"use strict";
/* ============ WEEK CONTEXT ============ */
// NFL week derived from season start (2026 Week 1 Thursday = Sept 10)
const SEASON_START = new Date("2026-09-10T00:00:00").getTime();
const WEEK_NUM = Math.max(1, Math.min(18, Math.floor((Date.now() - SEASON_START) / (7*24*3600*1000)) + 1));

/* Curated: the injuries that actually matter THIS week.
   Updated by Brio via site pushes. Keep tight: only new/changed this week. */
const WEEK_STORIES = [
  { name:"Saquon Barkley", team:"PHI", pos:"RB", status:"Out",
    note:"Hamstring — week-to-week, expected to sit Week 5 in London. Will Shipley starts." },
  { name:"Tank Bigsby", team:"PHI", pos:"RB", status:"IR",
    note:"Core-muscle surgery, ~6 weeks on IR. Eagles backfield is Shipley alone." },
  { name:"Alvin Kamara", team:"NO", pos:"RB", status:"Questionable",
    note:"Limped off on MNF vs Falcons (3rd Q) but returned to the game. Still listed Q on the official report — Kendre Miller is the handcuff." },
  { name:"Ladd McConkey", team:"LAC", pos:"WR", status:"Questionable",
    note:"Foot — week-to-week since leaving the Week 4 game early with 0 catches." },
  { name:"Tyquan Thornton", team:"KC", pos:"WR", status:"IR",
    note:"Ankle surgery, out 12–16 weeks. Chiefs down a deep threat." },
];

/* ============ CONFIG ============ */
const POLL_MS = 90_000;               // re-check every 90s
const POSITIONS = ["QB","RB","WR","TE"];
const SKIP_STATUS = new Set(["", null, undefined]);
// Yahoo OAuth broker (Cloudflare Worker). Empty = Yahoo connect hidden.
const YAHOO_WORKER = "";

/* Handcuff / beneficiary map: injured star -> waiver target.
   Keyed by lowercase full name. EVERY entry verified against 2026-27
   depth charts on 2026-10-06. Rebuild (don't patch) when rosters shift. */
const WAIVER_MAP = {
  "saquon barkley":   { pickup:"Will Shipley", note:"Last healthy Eagles back with Barkley week-to-week (hamstring) and Bigsby on IR after core-muscle surgery. Real pass-catching role." },
  "tank bigsby":      { pickup:"Will Shipley", note:"Bigsby needs core-muscle surgery (~6 weeks on IR). Shipley is the last man standing in Philly." },
  "alvin kamara":     { pickup:"Kendre Miller", note:"In line for the lead-back role with Kamara banged up and Etienne on IR. CJ Donaldson is the deep stash." },
  "travis etienne":   { pickup:"Kendre Miller", note:"Etienne on IR (hamstring, min. 4 games) in New Orleans. Miller leads the backfield with Kamara also hurt." },
  "jeremiyah love":   { pickup:"Tyler Allgeier", note:"Veteran RB2 who led Arizona's backfield in snaps Weeks 1-2. Lead back if the rookie sits." },
  "josh jacobs":      { pickup:["MarShawn Lloyd","Kaleb Johnson"], note:"GB backfield splits if Jacobs sits — Lloyd is the nominal RB2, Johnson the upside rookie per ESPN." },
  "breece hall":      { pickup:"Braelon Allen", note:"Takes over the Jets' lead-back role. Isaiah Davis behind him." },
  "jadarian price":   { pickup:"Emanuel Wilson", note:"Seattle's RB2 with Price on IR — clear backfield bump behind the starter." },
  "de'von achane":    { pickup:["Jaylen Wright","Ollie Gordon II"], note:"Committee with Achane done for the year (knee) — Wright leads early downs, Gordon mixes in." },
  "rico dowdle":      { pickup:"Travis Homer", note:"Pittsburgh's RB2 behind Jaylen Warren with Dowdle out (toe)." },
  "rachaad white":    { pickup:"Kaytron Allen", note:"Next up in Washington behind Jacory Croskey-Merritt with White out." },
  "isiah pacheco":    { pickup:"Sione Vaki", note:"Next healthy back behind Jahmyr Gibbs in Detroit (Pacheco on IR). Jacob Saylors is RB4." },
  "kyle monangai":    { pickup:"Roschon Johnson", note:"Absorbs short-yardage and goal-line work in Chicago if Monangai sits; Swift gets more volume." },
  "ja'marr chase":    { pickup:"Dohnte Meyers", note:"Cincinnati's WR3 with a huge role — Chase is out, Higgins is questionable, Iosivas is on IR." },
  "tee higgins":      { pickup:"Dohnte Meyers", note:"Would start for Cincinnati if Higgins sits. Already has a real role." },
  "a.j. brown":       { pickup:"Romeo Doubs", note:"$68M free-agent signing steps into New England's WR1 role. Mack Hollins is the red-zone veteran behind him." },
  "mack hollins":     { pickup:"Romeo Doubs", note:"Doubs' role grows with Hollins questionable — already New England's WR1 with Brown on IR." },
  "justin jefferson": { pickup:"Jordan Addison", note:"Takes over as Minnesota's lead receiver with Jefferson out (ankle). Jauan Jennings is WR3." },
  "ladd mcconkey":    { pickup:"Tre Harris", note:"Still on the Chargers as WR3 — steps into a starting role next to Quentin Johnston with McConkey out (foot)." },
  "dj moore":         { pickup:"Keon Coleman", note:"Buffalo's big-bodied WR steps into a bigger role with Moore questionable. The market is already all over him." },
  "devonta smith":    { pickup:"Hollywood Brown", note:"Listed directly behind Smith on Philadelphia's depth chart. Makai Lemon gets a bump in 3-WR sets." },
  "rashee rice":      { pickup:"Jalen Royals", note:"Next man up in Kansas City behind Rice (Thornton is also hurt). Worthy already starts." },
  "terry mclaurin":   { pickup:"Dyami Brown", note:"Listed directly behind McLaurin at X receiver in Washington. Stefon Diggs also on the roster." },
  "jayden reed":      { pickup:["Bo Melton","Matthew Golden"], note:"Reed's WR2 role splits — Melton is the listed backup, Golden the rookie riser." },
  "keenan allen":     { pickup:"Josh Downs", note:"Clear-cut WR1 for Indianapolis with Allen out. Newly signed Darius Slayton is the riser behind him." },
  "alec pierce":      { pickup:"Josh Downs", note:"Already the target leader with Pierce on IR." },
  "caleb douglas":    { pickup:"Ryan Miller", note:"Listed as Douglas's direct backup on Miami's official depth chart." },
  "jayden higgins":   { pickup:"Xavier Hutchinson", note:"Starting WR for Houston with Higgins done (torn ACL). Jaylin Noel also absorbs snaps." },
  "tank dell":        { pickup:"Xavier Hutchinson", note:"Same — Dell remains on IR." },
  "jalen mcmillan":   { pickup:"Ted Hurst III", note:"Rookie cited as the biggest beneficiary of McMillan's IR stint (PCL sprain, 6-8 weeks)." },
  "lamar jackson":    { pickup:"Tyler Huntley", note:"Re-signed 2yr/$5M as Baltimore's backup; in line for his 12th career Ravens start." },
  "jayden daniels":   { pickup:"Marcus Mariota", note:"Veteran backup; his rushing keeps Washington's scheme functional." },
  "caleb williams":   { pickup:"Tyson Bagent", note:"Expected to start with Williams out (hamstring). Case Keenum is QB3." },
  "jaxson dart":      { pickup:"Jameis Winston", note:"Already named the Giants' starter for the rest of the season (Dart: season-ending knee surgery)." },
  "baker mayfield":   { pickup:"Jalon Daniels", note:"UDFA rookie named Tampa's Week 4 starter with Mayfield out (dislocated thumb, multi-week)." },
  "david njoku":      { pickup:"Oronde Gadsden", note:"The healthy pass-catching TE for the Chargers with Njoku on IR and Kolar doubtful." },
  "dallas goedert":   { pickup:"Zach Ertz", note:"Re-signed with Philadelphia and listed as TE2. Veteran who knows the offense." },
  "mason taylor":     { pickup:"Kenyon Sadiq", note:"Already starting as the Jets' TE1 — every-down role in a TE-friendly offense." },
};

/* ============ STATE ============ */
let players = {};          // id -> normalized
let prevStatus = {};       // id -> injury_status (for change detection)
let changes = [];          // {t, name, team, pos, from, to}
let trending = [];
let trendingNames = new Set(); // normalized names with active add volume
let filter = "TRENDING", query = "";
try { prevStatus = JSON.parse(localStorage.getItem("ww_prev") || "{}"); } catch(e){}

const $ = id => document.getElementById(id);
const listEl = $("list"), statusEl = $("status");

function normName(n){ return (n||"").toLowerCase().trim(); }
function badgeClass(s){
  s = (s||"").toUpperCase();
  if (s.includes("QUESTIONABLE")) return "b-Q";
  if (s.includes("DOUBTFUL")) return "b-D";
  if (s === "OUT") return "b-O";
  if (s.includes("IR") || s.includes("INJURED RESERVE")) return "b-IR";
  if (s.includes("PUP")) return "b-PUP";
  if (s.includes("SUS")) return "b-SUS";
  return "b-Q";
}
function shortStatus(s){
  s=(s||"").toUpperCase();
  if(s.includes("QUESTIONABLE")) return "Q";
  if(s.includes("DOUBTFUL")) return "D";
  if(s==="OUT") return "OUT";
  if(s.includes("IR")) return "IR";
  if(s.includes("PUP")) return "PUP";
  return s.slice(0,12);
}
function timeAgo(t){
  const s = Math.floor((Date.now()-t)/1000);
  if (s < 60) return s+"s ago";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  return Math.floor(s/3600)+"h ago";
}
function relevance(p){
  // lower search_rank = more relevant; unranked go last
  return (p.search_rank && p.search_rank > 0) ? p.search_rank : 99999;
}

async function fetchPlayers(){
  const r = await fetch("https://api.sleeper.app/v1/players/nfl");
  if (!r.ok) throw new Error("players fetch failed");
  return r.json();
}
async function fetchTrending(){
  try{
    const r = await fetch("https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=25");
    if (!r.ok) return [];
    return r.json();
  }catch(e){ return []; }
}

// Which teams have finished this week's game (ESPN scoreboard).
// A Questionable tag older than the final whistle is a leftover, not news.
let teamGameEnd = {};
async function fetchScoreboard(){
  try{
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week=${WEEK_NUM}`);
    if (!r.ok) return {};
    const d = await r.json();
    const map = {};
    for (const e of (d.events || [])){
      const comp = e.competitions && e.competitions[0];
      if (!comp || !comp.status || comp.status.type.state !== "post") continue;
      const end = new Date(comp.date).getTime() + 4*3600*1000;
      for (const c of (comp.competitors || [])){
        let abbr = c.team.abbreviation;
        if (abbr === "WSH") abbr = "WAS"; // ESPN -> Sleeper
        map[abbr] = end;
      }
    }
    return map;
  }catch(e){ return {}; }
}
function isStaleQ(p){
  if (!/QUESTIONABLE/i.test(p.status || "")) return false;
  const end = teamGameEnd[p.team];
  if (!end) return false;
  return (p.news_updated || 0) < end;
}

function detectChanges(next){
  const now = Date.now();
  for (const id in next){
    const p = next[id];
    const prev = prevStatus[id];
    if (prev !== undefined && prev !== p.status){
      changes.unshift({ t: now, name: p.name, team: p.team, pos: p.pos,
        from: prev || "Healthy", to: p.status || "Healthy", id });
      if (changes.length > 60) changes.pop();
      if (hidden[id]){ delete hidden[id]; // fresh data overrides a manual hide
        try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){} }
      const nk = "name:" + normName(p.name);
      if (hidden[nk]){ delete hidden[nk];
        try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){} }
    }
  }
  prevStatus = {};
  for (const id in next) prevStatus[id] = next[id].status;
  try{ localStorage.setItem("ww_prev", JSON.stringify(prevStatus)); }catch(e){}
}

function pickupsOf(w){ return Array.isArray(w.pickup) ? w.pickup : [w.pickup]; }

function waiverFor(p){
  const w = WAIVER_MAP[normName(p.name)];
  if (w){
    // The curated pickup must be validated by the market — if nobody is
    // adding him, he's trash or already gone; fall through to the fallback.
    const live = pickupsOf(w).filter(n => trendingNames.has(normName(n)));
    if (live.length){
      return `<div class="waiver"><div class="wl">⚡ Waiver target${live.length>1?"s":""}</div>` +
        live.map(n=>`<div class="wp">${badgeNames(n)}</div>`).join("") +
        `<div class="wn">${esc(w.note)}</div></div>`;
    }
  }
  // Fallback: same team + same position trending adds only.
  // A backup worth adding plays for the same team as the injured guy —
  // league-wide trending WRs are noise on an unrelated injury.
  const same = trending
    .map(t => ({ info: players[t.player_id], count: t.count }))
    .filter(x => x.info && x.info.pos === p.pos && x.info.team && x.info.team === p.team
      && normName(x.info.name) !== normName(p.name))
    .slice(0, 2);
  if (!same.length) return "";
  const names = same.map(x =>
    `<div class="wp">${esc(x.info.name)} <span style="color:var(--muted);font-weight:400">· ${esc(x.info.team||"FA")}</span></div>
     <div class="wn">+${Number(x.count).toLocaleString()} adds in 24h — same team, same position.</div>`
  ).join("");
  return `<div class="waiver"><div class="wl">🔥 Trending ${esc(p.team)} ${esc(p.pos)} adds</div>${names}</div>`;
}
// Manual hide: viewer sees a player active in-game but the API still lists
// them as hurt. Tapping hide removes them; any fresh status change clears it.
let hidden = {};
try{ hidden = JSON.parse(localStorage.getItem("ww_hidden") || "{}"); }catch(e){}
(function pruneHidden(){
  const now = Date.now();
  let dirty = false;
  for (const id in hidden) if (now - hidden[id] > 24*3600*1000){ delete hidden[id]; dirty = true; }
  if (dirty) try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){}
})();

function hideKey(p){ return p.id || ("name:" + normName(p.name)); }
function isHidden(p){ return hidden[hideKey(p)] || (p.id && hidden["name:" + normName(p.name)]); }

function titleCase(s){ return (s||"").split(" ").map(w=>w? w[0].toUpperCase()+w.slice(1):w).join(" "); }
function statusRank(s){ return /IR|PUP/i.test(s) ? 0 : /OUT/i.test(s) ? 1 : /DOUBTFUL/i.test(s) ? 2 : 3; }

// Reverse index: pickup name -> whose injury is driving the adds.
const PICKUP_CONTEXT = {};
for (const k of Object.keys(WAIVER_MAP)){
  const w = WAIVER_MAP[k];
  for (const name of pickupsOf(w)){
    const pk = normName(name);
    (PICKUP_CONTEXT[pk] = PICKUP_CONTEXT[pk] || []).push({ injured: k, note: w.note });
  }
}

function injuryContextFor(p){
  const pk = normName(p.name);
  if (PICKUP_CONTEXT[pk]){
    const c = PICKUP_CONTEXT[pk][0];
    return "⚡ " + titleCase(c.injured) + " fill-in — " + c.note;
  }
  // All hurt teammates at the same position — derived live, so every player
  // in a banged-up unit gets the full picture with zero manual upkeep.
  const hurt = Object.values(players).filter(x =>
    x.team && x.team === p.team && x.pos === p.pos && x.status && !isStaleQ(x) &&
    /OUT|IR|DOUBTFUL|PUP|SUSP|QUESTIONABLE/i.test(x.status) && normName(x.name) !== pk);
  if (hurt.length){
    hurt.sort((a,b) => (statusRank(a.status) - statusRank(b.status)) || (relevance(a) - relevance(b)));
    return "🏥 With " + hurt.slice(0, 3).map(h => h.name + " (" + shortStatus(h.status) + ")").join(" & ");
  }
  return "📈 Breakout / role bump — the crowd is buying";
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// Auto-generate "this week" stories from significant status changes detected
// in the last 7 days. No manual updates needed — the feed writes itself.
function autoWeekStories(){
  const weekAgo = Date.now() - 7*24*3600*1000;
  const badTo = ["OUT","IR","DOUBTFUL","PUP","SUSP"];
  const seen = {};
  const out = [];
  for (const c of changes){
    if (c.t < weekAgo || seen[c.id]) continue;
    const toUp = (c.to||"").toUpperCase();
    const fromUp = (c.from||"").toUpperCase();
    const worsened = badTo.some(k=>toUp.includes(k)) ||
      (toUp.includes("QUESTIONABLE") && !fromUp.includes("QUESTIONABLE"));
    if (!worsened) continue;
    seen[c.id] = 1;
    out.push(c);
  }
  out.sort((a,b)=>{
    const ra = players[a.id] ? relevance(players[a.id]) : 99999;
    const rb = players[b.id] ? relevance(players[b.id]) : 99999;
    return ra - rb;
  });
  return out.slice(0,6);
}

/* ============ YAHOO (optional, per-visitor) ============ */
// Connects the visitor's own Yahoo fantasy account so waiver targets show
// whether each player is actually on THEIR league's wire. Tokens live only
// in this browser's localStorage. Inert until YAHOO_WORKER is configured.
const normYahoo = n => (n || "").toLowerCase().replace(/\./g, "").trim();
let yahooAvailable = new Set();   // normalized names on the visitor's wire
let yahooLeagueName = "";

function yahooConnected(){
  try{ return !!JSON.parse(localStorage.getItem("ww_yahoo") || "null"); }
  catch(e){ return false; }
}

// OAuth callback landed with tokens in the URL fragment — capture & clear.
(function yahooCapture(){
  const h = location.hash || "";
  if (h.includes("yahoo_access_token")){
    const ps = new URLSearchParams(h.slice(1));
    const access = ps.get("yahoo_access_token"), refresh = ps.get("yahoo_refresh_token");
    if (access) localStorage.setItem("ww_yahoo",
      JSON.stringify({ access, refresh, exp: Date.now() + 3600 * 1000 }));
    history.replaceState(null, "", location.pathname + location.search);
  }
})();

async function yahooFetch(path, opts = {}) {
  const tok = JSON.parse(localStorage.getItem("ww_yahoo") || "null");
  if (!tok) throw new Error("not connected");
  const call = access => fetch(YAHOO_WORKER + path, {
    ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + access },
  });
  let r = await call(tok.access);
  if (r.status === 401 && tok.refresh) {
    const rr = await fetch(YAHOO_WORKER + "/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: tok.refresh }),
    });
    const nt = await rr.json().catch(() => ({}));
    if (nt.access_token) {
      const next = { access: nt.access_token, refresh: nt.refresh_token || tok.refresh, exp: Date.now() + 3600 * 1000 };
      localStorage.setItem("ww_yahoo", JSON.stringify(next));
      r = await call(next.access);
    }
  }
  return r;
}

async function yahooSync() {
  try {
    const lr = await yahooFetch("/api/leagues");
    const leagues = (await lr.json()).leagues || [];
    if (!leagues.length) return;
    yahooLeagueName = leagues[0].name || "";
    const fr = await yahooFetch("/api/freeagents?league_key=" + encodeURIComponent(leagues[0].league_key));
    const fj = await fr.json();
    yahooAvailable = new Set((fj.available || []).map(p => normYahoo(p.name != null ? p.name : p)));
  } catch (e) { /* stay in public mode */ }
  updateYahooBtn();
  render();
}

function updateYahooBtn() {
  const b = $("yahooBtn");
  if (!YAHOO_WORKER) { b.style.display = "none"; return; }
  b.style.display = "";
  b.textContent = yahooConnected()
    ? `✅ Yahoo connected${yahooLeagueName ? " · " + yahooLeagueName : ""} — tap to disconnect`
    : "🔗 Connect Yahoo — your league's actual wire";
}

// ✅ / ❌ availability badge for a possibly "A / B"-joined name string.
function badgeNames(joined) {
  if (!yahooConnected() || !yahooAvailable.size) return esc(joined);
  return String(joined).split(" / ").map(n => {
    const ok = yahooAvailable.has(normYahoo(n));
    return esc(n) + (ok ? ' <span title="On your waiver wire">✅</span>'
                        : ' <span title="Rostered in your league">❌</span>');
  }).join(" / ");
}

function render(){
  try { renderInner(); }
  catch(e){ listEl.innerHTML = `<div class="empty">Couldn't draw this view — tap ⟳ to retry.<br><span style="opacity:.6">${esc(e.message || e)}</span></div>`; }
}
function renderInner(){
  const q = query.toLowerCase();
  let html = "";
  if (filter === "CHANGES"){
    html += `<h2>🗓️ This week — Week ${WEEK_NUM}</h2>`;
    const wq = query.toLowerCase();
    const stories = WEEK_STORIES.filter(s => !wq || s.name.toLowerCase().includes(wq));
    html += stories.length ? stories.filter(s => !isHidden(s)).map(s=>{
      const w = WAIVER_MAP[normName(s.name)];
      return `<div class="card">
        <div class="row1"><div><div class="pname">${esc(s.name)}</div>
        <div class="pmeta">${esc(s.pos)} · ${esc(s.team)}</div></div>
        <span class="badge ${badgeClass(s.status)}">${esc(shortStatus(s.status))}</span>
        <button class="hidebtn" data-hide="${esc(hideKey(s))}" title="Hide — I see him playing">✕</button></div>
        <div class="inj">${esc(s.note)}</div>
        ${w?`<div class="waiver"><div class="wl">⚡ Waiver target${pickupsOf(w).length>1?"s":""}</div>
          ${pickupsOf(w).map(n=>`<div class="wp">${esc(n)}</div>`).join("")}
          <div class="wn">${esc(w.note)}</div></div>`:""}</div>`;
    }).join("") : `<div class="empty">No week-specific stories yet.</div>`;
    const auto = autoWeekStories().filter(s =>
      !WEEK_STORIES.some(w => normName(w.name) === normName(s.name)) && !isHidden(s));
    if (auto.length){
      html += `<h2>📡 Auto-detected this week</h2>`;
      html += auto.map(s=>{
        const p = players[s.id] || { name: s.name, pos: s.pos, team: s.team };
        return `<div class="card">
          <div class="row1"><div><div class="pname">${esc(s.name)}</div>
          <div class="pmeta">${esc(s.pos)} · ${esc(s.team||"")}</div></div>
          <span class="badge ${badgeClass(s.to)}">${esc(shortStatus(s.to))}</span>
          <button class="hidebtn" data-hide="${esc(hideKey(p))}" title="Hide — I see him playing">✕</button></div>
          <div class="inj">${esc(s.from)} → ${esc(s.to)} · ${timeAgo(s.t)}</div>
          ${waiverFor(p)}</div>`;
      }).join("");
    }
    html += "<h2>⚡ Live status changes</h2>";
    const items = changes.filter(c => !wq || c.name.toLowerCase().includes(wq)).slice(0,40);
    html += items.length ? items.map(c=>
      `<div class="change"><b>${esc(c.name)}</b> <span style="color:var(--muted)">${esc(c.pos)} · ${esc(c.team||"")}</span><br>
       ${esc(c.from)} → <b>${esc(c.to)}</b> · <time>${timeAgo(c.t)}</time></div>`
    ).join("") : `<div class="empty">No live changes detected yet.<br>Keep this page open — updates land automatically.</div>`;
  } else if (filter === "TRENDING"){
    html += "<h2>🎯 Top waiver targets</h2><div class='pmeta' style='margin:0 2px 10px;opacity:.75'>Fresh injury-driven pickups first, then who's hot in the last 24h.</div>";
    const seen = new Set();
    const cards = [];
    const findByName = n => {
      const k = normName(n);
      return Object.values(players).find(p => normName(p.name) === k);
    };
    // Availability: normalized names with active add volume in the last 24h.
    // A curated pickup nobody is adding is already rostered — don't recommend him.
    const trendingCounts = {};
    for (const t of trending){
      const p = players[t.player_id];
      if (p) trendingCounts[normName(p.name)] = t.count;
    }
    // 1. Injury-driven targets from the curated map — fresh news only (5d),
    // ranked by severity first, then recency, then relevance. Last week's news is done.
    const FRESH_MS = 5*24*3600*1000;
    const hurt = Object.values(players)
      .filter(p => p.status && /OUT|IR|DOUBTFUL|PUP|QUESTIONABLE/i.test(p.status) && POSITIONS.includes(p.pos) && !isHidden(p)
        && !isStaleQ(p) && p.news_updated && (Date.now() - p.news_updated) < FRESH_MS)
      .sort((a,b) => (statusRank(a.status) - statusRank(b.status)) || (b.news_updated - a.news_updated) || (relevance(a) - relevance(b)));
    // Group curated pickups: when several injuries point at the same pickup,
    // the freshest news drives the attribution — not a weeks-old IR stint.
    const byPickup = new Map();
    for (const h of hurt){
      const w = WAIVER_MAP[normName(h.name)];
      if (!w) continue;
      for (const name of pickupsOf(w)){
        const pk = normName(name);
        if (!trendingNames.has(pk) || seen.has(pk)) continue;
        const cur = byPickup.get(pk);
        if (!cur || (h.news_updated || 0) > (cur.h.news_updated || 0))
          byPickup.set(pk, { h, w, name, adds: trendingCounts[pk] || 0 });
      }
    }
    const drivers = [...byPickup.values()]
      .sort((a,b) => (statusRank(a.h.status) - statusRank(b.h.status))
        || (b.adds - a.adds)
        || ((b.h.news_updated || 0) - (a.h.news_updated || 0))
        || (relevance(a.h) - relevance(b.h)))
      .slice(0, 6);
    for (const { h, w, name } of drivers){
      const pk = normName(name);
      seen.add(pk);
      const pl = findByName(name) || {};
      const cnt = trendingCounts[pk];
      // Secondary context: other injuries pointing at the same pickup.
      // Mentioned, but they don't drive the ranking.
      const others = [];
      for (const h2 of hurt){
        if (normName(h2.name) === normName(h.name)) continue;
        const w2 = WAIVER_MAP[normName(h2.name)];
        if (!w2 || !pickupsOf(w2).some(n => normName(n) === pk)) continue;
        if (!others.some(o => normName(o.name) === normName(h2.name))) others.push(h2);
      }
      others.sort((a,b) => (statusRank(a.status) - statusRank(b.status)) || ((b.news_updated || 0) - (a.news_updated || 0)));
      const secondary = others.slice(0, 2).map(o => o.name + " (" + shortStatus(o.status) + ")").join(" + ");
      cards.push({ name, pos: pl.pos || "", team: pl.team || "",
        count: cnt ? Number(cnt).toLocaleString() : null,
        ctx: "⚡ " + h.name + " (" + shortStatus(h.status) + ")" + (secondary ? " + " + secondary : "") + " — " + w.note });
    }
    // 2. Trending fills the rest — tiered by conviction, not raw hype:
    //    tier 0 = curated pickup (analyst + crowd agree)
    //    tier 1 = real injury situation behind the adds
    //    tier 2 = pure hype (no injury link)
    const fillers = [];
    for (const t of trending){
      if (seen.size >= 24) break; // collect enough to tier-sort
      const p = players[t.player_id];
      if (!p || !POSITIONS.includes(p.pos)) continue;
      if (seen.has(normName(p.name))) continue;
      if (q && !p.name.toLowerCase().includes(q)) continue;
      seen.add(normName(p.name));
      const ctx = injuryContextFor(p);
      const tier = PICKUP_CONTEXT[normName(p.name)] ? 0 : (ctx.startsWith("📈") ? 2 : 1);
      fillers.push({ name: p.name, pos: p.pos, team: p.team || "FA",
        count: Number(t.count).toLocaleString(), countNum: Number(t.count) || 0,
        ctx, tier });
    }
    fillers.sort((a,b) => (a.tier - b.tier) || (b.countNum - a.countNum));
    for (const f of fillers){
      if (cards.length >= 12) break;
      cards.push(f);
    }
    html += cards.length ? cards.map((c, i)=>
      `<div class="card">
        <div class="row1"><div><div class="pname"><span style="color:var(--muted)">#${i+1}</span> ${badgeNames(c.name)}</div>
        <div class="pmeta">${esc(c.pos)}${c.pos && c.team ? " · " : ""}${esc(c.team)}</div></div>
        ${c.count ? `<span class="adds" style="color:var(--green);font-weight:800">+${c.count}</span>` : ""}</div>
        <div class="inj">${esc(c.ctx)}</div></div>`
    ).join("") : `<div class="empty">Loading waiver targets…</div>`;
  } else {
    let arr = Object.values(players).filter(p =>
      POSITIONS.includes(p.pos) && p.status && !SKIP_STATUS.has(p.status) && !isHidden(p) && !isStaleQ(p));
    // Browsing shows the last 14 days of injury news — older than that isn't actionable.
    // Searching digs through everything.
    if (!q){
      const BROWSE_FRESH_MS = 14*24*3600*1000;
      arr = arr.filter(p => p.news_updated && (Date.now() - p.news_updated) < BROWSE_FRESH_MS);
    }
    if (filter !== "ALL") arr = arr.filter(p => p.pos === filter);
    if (q) arr = arr.filter(p => p.name.toLowerCase().includes(q));
    arr.sort((a,b)=> relevance(a)-relevance(b));
    const byRecent = (a,b) => (b.news_updated||0) - (a.news_updated||0);
    const bad = arr.filter(p=>["OUT","IR","PUP","DOUBTFUL"].some(k=>p.status.toUpperCase().includes(k))).sort(byRecent);
    const ques = arr.filter(p=>p.status.toUpperCase().includes("QUESTIONABLE")).sort(byRecent);
    const other = arr.filter(p=>!bad.includes(p)&&!ques.includes(p)).sort(byRecent);
    const groups = [["⛔ Out / IR / Doubtful",bad],["❓ Questionable",ques],["ℹ️ Other",other]];
    for (const [title, g] of groups){
      if (!g.length) continue;
      html += `<h2>${title} (${g.length})</h2>`;
      html += g.slice(0,80).map(p=>{
        const isNew = changes.length && changes[0].id && String(changes[0].id)===String(p.id) &&
          (Date.now()-changes[0].t) < 10*60*1000;
        return `<div class="card${isNew?" new":""}">
          <div class="row1"><div><div class="pname">${esc(p.name)}</div>
          <div class="pmeta">${esc(p.pos)} · ${esc(p.team||"FA")}${p.injury_part? " · "+esc(p.injury_part):""}</div></div>
          <span class="badge ${badgeClass(p.status)}">${esc(shortStatus(p.status))}</span>
          <button class="hidebtn" data-hide="${esc(hideKey(p))}" title="Hide — I see him playing">✕</button></div>
          ${p.injury_notes?`<div class="inj">${esc(p.injury_notes)}</div>`:""}
          ${p.news_updated?`<div class="pmeta" style="margin-top:2px;opacity:.7">Status updated ${timeAgo(p.news_updated)}</div>`:""}
          ${waiverFor(p)}</div>`;
      }).join("");
    }
    if (!arr.length) html = `<div class="empty">No injuries match. 🎉</div>`;
  }
  const hiddenCount = Object.keys(hidden).length;
  if (hiddenCount) html = `<div class="pmeta" style="margin:4px 2px 8px;opacity:.8">${hiddenCount} hidden by you · <a href="#" id="restoreHidden" style="color:var(--accent)">restore</a></div>` + html;
  listEl.innerHTML = html;
}

let lastOk = 0;
async function refresh(manual){
  try{
    if (manual) statusEl.textContent = "Pulling latest…";
    const [pd, tr, sb] = await Promise.all([fetchPlayers(), fetchTrending(), fetchScoreboard()]);
    const next = {};
    for (const id in pd){
      const p = pd[id];
      if (!p || !POSITIONS.includes(p.position)) continue;
      next[id] = { id, name: p.full_name || (p.first_name+" "+p.last_name),
        pos: p.position, team: p.team || "", status: p.injury_status || "",
        injury_part: p.injury_body_part || "", injury_notes: p.injury_notes || "",
        news_updated: p.news_updated || 0,
        search_rank: p.search_rank || 99999 };
    }
    detectChanges(next);
    players = next; trending = tr || [];
    teamGameEnd = sb || {};
    trendingNames = new Set();
    for (const t of trending){
      const p = players[t.player_id];
      if (p) trendingNames.add(normName(p.name));
    }
    lastOk = Date.now();
    statusEl.innerHTML = `<span class="dot"></span> Live · updated ${timeAgo(lastOk)} · checks every 90s`;
    render();
  }catch(e){
    statusEl.textContent = lastOk ? `Live · last good update ${timeAgo(lastOk)} · retrying…`
                                  : "Couldn't reach injury feed — retrying…";
  }
}

$("tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  b.classList.add("active"); filter = b.dataset.f; render();
});
listEl.addEventListener("click", e=>{
  const hb = e.target.closest("[data-hide]");
  if (hb){
    hidden[hb.dataset.hide] = Date.now();
    try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){}
    render();
    return;
  }
  if (e.target.closest("#restoreHidden")){
    e.preventDefault();
    hidden = {};
    try{ localStorage.setItem("ww_hidden", "{}"); }catch(e){}
    render();
  }
});
$("search").addEventListener("input", e=>{ query = e.target.value; render(); });
$("refreshBtn").addEventListener("click", ()=>refresh(true));
$("yahooBtn").addEventListener("click", ()=>{
  if (yahooConnected()){
    localStorage.removeItem("ww_yahoo");
    yahooAvailable = new Set(); yahooLeagueName = "";
    updateYahooBtn(); render();
  } else if (YAHOO_WORKER){
    location.href = YAHOO_WORKER + "/auth/start";
  }
});
setInterval(()=>refresh(false), POLL_MS);
setInterval(()=>{ // keep "xm ago" labels fresh
  if (lastOk) statusEl.innerHTML = `<span class="dot"></span> Live · updated ${timeAgo(lastOk)} · checks every 90s`;
}, 15000);
updateYahooBtn();
if (YAHOO_WORKER && yahooConnected()) yahooSync();
refresh(false);
</script>
