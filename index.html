<script>
"use strict";
const BUILD_V = 78; // bump every push; shown in footer to spot cached code

/* ============ WEB PUSH (closed-app alerts, v78) ============ */
const VAPID_PUBLIC_KEY = "BE9MRYgq1CVDlaZUKIRHfgLzUGVXRHfXsztOeL53e1g9vqe83lkpj8CgShE1-HOixbqWuo1C7H93L2SuTZZzra4";
function urlBase64ToUint8Array(b64){
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const b = (b64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b); const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function setupPush(){
  const panel = document.getElementById("pushSetup");
  const status = document.getElementById("pushStatus");
  const box = document.getElementById("pushSubBox");
  const copyBtn = document.getElementById("pushCopyBtn");
  panel.style.display = "block";
  try{
    if (!("serviceWorker" in navigator) || !("PushManager" in window)){
      status.textContent = "Push not supported in this browser. Use Safari → Add to Home Screen.";
      return;
    }
    status.textContent = "Registering…";
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    status.textContent = "Subscribing…";
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const j = sub.toJSON();
    box.value = JSON.stringify(j);
    box.style.display = "block";
    copyBtn.style.display = "block";
    status.innerHTML = "✅ <b>You're subscribed.</b> Tap below, copy the code, and paste it to Brio in chat — that's the last step.";
    copyBtn.onclick = async ()=>{
      try{ await navigator.clipboard.writeText(box.value); }
      catch(e){ box.select(); document.execCommand("copy"); }
      copyBtn.textContent = "✅ Copied — paste it to Brio";
    };
  }catch(e){
    status.textContent = "Setup hiccup: " + (e && e.message ? e.message : e) + ". Make sure the app is installed to your Home Screen and notifications are allowed.";
  }
}
// Register the service worker on every load so pushes can arrive when closed.
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ============ WEEK CONTEXT ============ */
// NFL week derived from season start (2026 Week 1 Thursday = Sept 10)
const SEASON_START = new Date("2026-09-10T00:00:00").getTime();
const WEEK_NUM = Math.max(1, Math.min(18, Math.floor((Date.now() - SEASON_START) / (7*24*3600*1000)) + 1));

/* Curated: the injuries that actually matter THIS week.
   Updated by Brio via site pushes. Keep tight: only new/changed this week. */
const WEEK_STORIES = [

    note:"Hamstring — week-to-week, expected to sit Week 5 in London. Will Shipley starts." },

/* ============ CONFIG ============ */

// Yahoo OAuth broker (Cloudflare Worker). Empty = Yahoo connect hidden.

/* Handcuff / beneficiary map: injured star -> waiver target.

  "tank dell":        { pickup:"Xavier Hutchinson", note:"Same — Dell remains on IR." },
  "jalen mcmillan":   { pickup:"Ted Hurst III", note:"Rookie cited as the biggest beneficiary of McMillan's IR stint (PCL sprain, 6-8 weeks)." },
  "lamar jackson":    { pickup:"Tyler Huntley", note:"Re-signed 2yr/$5M as Baltimore's backup; in line for his 12th career Ravens start." },
  "jayden daniels":   { pickup:"Marcus Mariota", note:"Veteran backup; his rushing keeps Washington's scheme functional." },
  "caleb williams":   { pickup:"Tyson Bagent", note:"Expected to start with Williams out (hamstring). Case Keenum is QB3." },
  "jaxson dart":      { pickup:"Jameis Winston", note:"Already named the Giants' starter for the rest of the season (Dart: season-ending knee surgery)." },
  "baker mayfield":   { pickup:"Jalon Daniels", note:"UDFA rookie named Tampa's Week 4 starter with Mayfield out (dislocated thumb, multi-week)." },
  "david njoku":      { pickup:"Oronde Gadsden", note:"The healthy pass-catching TE for the Chargers with Njoku on IR and Kolar doubtful." },
  "dallas goedert":   { pickup:"Zach Ertz", note:"Re-signed with Philadelphia and listed as TE2. Veteran who knows the offense." },

/* ============ STATE ============ */
let players = {};          // id -> normalized
let prevStatus = {};       // id -> injury_status (for change detection)
let prevNews = {};         // id -> news_updated timestamp (for news-update detection)
let changes = [];          // {t, name, team, pos, from, to} or {t, name, team, pos, news:true}
let trending = [];
let nflNews = [];          // ESPN NFL news articles {headline, desc, published, link}
let trendingNames = new Set(); // normalized names with active add volume
let filter = "CHANGES", query = "";
try { prevStatus = JSON.parse(localStorage.getItem("ww_prev") || "{}"); } catch(e){}
try { prevNews = JSON.parse(localStorage.getItem("ww_prevnews") || "{}"); } catch(e){}

const $ = id => document.getElementById(id);
const listEl = $("list"), statusEl = $("status");

function normName(n){ return (n||"").toLowerCase().replace(/[''']/g, "").trim(); }
function badgeClass(s){
  s = (s||"").toUpperCase();
  if (s.includes("QUESTIONABLE")) return "b-Q";
  if (s.includes("DOUBTFUL")) return "b-D";
  if (s === "OUT") return "b-O";
  if (s.includes("IR") || s.includes("INJURED RESERVE")) return "b-IR";
  if (s.includes("PUP")) return "b-PUP";
  if (s.includes("SUS")) return "b-SUS";
  return "b-Q";
}
function shortStatus(s){
  s=(s||"").toUpperCase();
  if(s.includes("QUESTIONABLE")) return "Q";
  if(s.includes("DOUBTFUL")) return "D";
  if(s==="OUT") return "OUT";
  if(s.includes("IR")) return "IR";
  if(s.includes("PUP")) return "PUP";
  return s.slice(0,12);
}
function timeAgo(t){
  const s = Math.floor((Date.now()-t)/1000);
  if (s < 60) return s+"s ago";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  return Math.floor(s/3600)+"h ago";
}
function relevance(p){
  // lower search_rank = more relevant; unranked go last
  return (p.search_rank && p.search_rank > 0) ? p.search_rank : 99999;
}

async function fetchPlayers(){
  const r = await fetch("https://api.sleeper.app/v1/players/nfl");
  if (!r.ok) throw new Error("players fetch failed");

}
async function fetchTrending(){

}

// ESPN NFL news wire — real-time headlines with reporter attribution,
// like Underdog's feed. Matched to players by name for expandable cards.
async function fetchNews(){
  try{
    const r = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100");
    if (!r.ok) return [];
    const d = await r.json();
    const cutoff = Date.now() - 24*3600*1000; // last 24 hours
    return (d.articles || []).map(a => ({
      headline: a.headline || "",
      desc: a.description || "",
      published: new Date(a.published).getTime() || 0,
      link: (a.links && a.links.web && a.links.web.href) || ""
    })).filter(a => a.headline && a.published && a.published >= cutoff);
  }catch(e){ return []; }
}

// Injury relevance scoring for the news wire — an injury wire shouldn't
// surface fantasy advice columns or lawsuits. Score by injury keywords,
// rank relevant first.
const INJURY_KW = ["injur", "out for", "sidelined", "questionable", "doubtful",
  "ir plac", "injured reserve", "surgery", "sprain", "tear", "fracture", "concussion",
  "hamstring", "acl", "mcl", "ankle", "knee", "shoulder", "inactive", "will miss",
  "expected to miss", "week-to-week", "day-to-day", "ruled out", "not expected to play",
  "unlikely to play", "game-time decision", "limited in practice", "did not practice",
  "dnps", "pup", "suspended", "failed physical", "after physical", "retire",
  "waived/injured", "injury settlement"];
// Transactions affect waiver decisions — relevant, but rank below pure injury news
const TRANSACTION_KW = ["sign", "release", "trade", "claim off waivers", "workout",
  "tryout", "visit", "elevat", "promot", "cut by", "waived by"];
function injuryScore(a){
  const t = (a.headline + " " + a.desc).toLowerCase();
  let s = 0;
  for (const k of INJURY_KW) if (t.includes(k)) s += 2;
  for (const k of TRANSACTION_KW) if (t.includes(k)) s += 1;
  // Reporter-attributed news is usually breaking — boost it
  if (/(rapoport|schefter|schultz|pelissero|glazer|rapsheet|adamschefter)/i.test(t.slice(0,60))) s += 3;
  return s;
}
// Match a news article to a player by name in headline/description.
function newsForPlayer(pname){
  const nn = normName(pname);
  const parts = nn.split(" ").filter(w => w.length > 2);
  if (parts.length < 2) return [];
  const last = parts[parts.length - 1];
  return nflNews.filter(a => {
    if (injuryScore(a) === 0) return false; // injury wire only
    const t = normName(a.headline + " " + a.desc);
    return t.includes(nn) || (t.includes(parts[0]) && t.includes(last));
  }).slice(0, 3);
}

// Which teams have finished this week's game (ESPN scoreboard).
// A Questionable tag older than the final whistle is a leftover, not news.
let teamGameEnd = {};
async function fetchScoreboard(){
  try{
    const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week=${WEEK_NUM}`);
    if (!r.ok) return {};
    const d = await r.json();
    const map = {};
    for (const e of (d.events || [])){
      const comp = e.competitions && e.competitions[0];
      if (!comp || !comp.status || comp.status.type.state !== "post") continue;
      const end = new Date(comp.date).getTime() + 16*3600*1000; // kickoff + game (~4h) + post-game grace (data refreshes aren't news)
      for (const c of (comp.competitors || [])){
        let abbr = c.team.abbreviation;
        if (abbr === "WSH") abbr = "WAS"; // ESPN -> Sleeper
        map[abbr] = end;
      }
    }
    return map;
  }catch(e){ return {}; }
}
function isStaleTag(p){
  // Weekly QUESTIONABLE tags older than the final whistle are last week's news
  // (player likely played). But OUT/DOUBTFUL are sticky — if Sleeper says a
  // guy is OUT, he's out until they say otherwise. Don't hide real injuries.
  if (!/QUESTIONABLE/i.test(p.status || "")) return false;
  const end = teamGameEnd[p.team];
  if (!end) return false;
  return (p.news_updated || 0) < end;
}
function livePlayerByName(name){
  const nk = normName(name);
  return Object.values(players).find(p => normName(p.name) === nk);
}
function isStoryStale(s){
  const p = livePlayerByName(s.name);
  return !!(p && isStaleTag(p));
}
function isChangeStale(c){
  // A recorded change is stale if the player's CURRENT status still matches
  // the change's "to" status and that status is now a post-game leftover.
  const p = c.id ? players[c.id] : livePlayerByName(c.name);
  if (!p || !p.status) return false;
  const target = (c.news ? c.status : c.to) || "";
  if (target.toUpperCase() !== (p.status || "").toUpperCase()) return false;
  return isStaleTag(p);
}

// Push notifications for injury changes (works while page is open;
// on iOS, add to Home Screen for banner-style alerts).
let notifyEnabled = false;
try{ notifyEnabled = localStorage.getItem("ww_notify") === "1"; }catch(e){}
function notifyPermitted(){ return notifyEnabled && "Notification" in window && Notification.permission === "granted"; }
function fireNotify(title, body){
  if (!notifyPermitted()) return;
  try{ new Notification(title, { body, icon: "icon.png" }); }catch(e){}
}
// Only notify for meaningful changes — not every Questionable tag.
function shouldNotify(from, to){
  const t = (to || "").toUpperCase();
  const f = (from || "").toUpperCase();
  // New serious designation
  if (/OUT|IR|DOUBTFUL/i.test(t) && !/OUT|IR|DOUBTFUL/i.test(f)) return true;
  // Downgrade: Q -> Out, etc. (getting worse)
  if (/QUESTIONABLE/i.test(f) && /OUT|IR|DOUBTFUL/i.test(t)) return true;
  return false;
}
function detectChanges(next){
  const now = Date.now();
  for (const id in next){
    const p = next[id];
    const prev = prevStatus[id];
    if (prev !== undefined && prev !== p.status){
      changes.unshift({ t: now, name: p.name, team: p.team, pos: p.pos,
        from: prev || "Healthy", to: p.status || "Healthy", id });
      if (changes.length > 60) changes.pop();
      if (shouldNotify(prev, p.status))
        fireNotify(`🚨 ${p.name} (${p.pos}, ${p.team})`, `${prev || "Healthy"} → ${p.status}${p.injury_part ? " · " + p.injury_part : ""}`);
      if (hidden[id]){ delete hidden[id]; // fresh data overrides a manual hide
        try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){} }
      const nk = "name:" + normName(p.name);
      if (hidden[nk]){ delete hidden[nk];
        try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){} }
    }
    // News-update detection: Sleeper bumps news_updated on fresh reports
    // (e.g. Rapoport "unlikely to play") even when injury_status doesn't change.
    const pn = prevNews[id];
    const nu = p.news_updated || 0;
    if (pn !== undefined && nu > pn && p.status && p.status !== "Healthy"){
      changes.unshift({ t: now, name: p.name, team: p.team, pos: p.pos,
        news: true, status: p.status, id });
      if (changes.length > 60) changes.pop();
      if (hidden[id]){ delete hidden[id];
        try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){} }
    }
  }
  prevStatus = {};
  prevNews = {};
  for (const id in next){ prevStatus[id] = next[id].status; prevNews[id] = next[id].news_updated || 0; }
  try{ localStorage.setItem("ww_prev", JSON.stringify(prevStatus)); }catch(e){}
  try{ localStorage.setItem("ww_prevnews", JSON.stringify(prevNews)); }catch(e){}
}

function pickupsOf(w){ return Array.isArray(w.pickup) ? w.pickup : [w.pickup]; }

function waiverFor(p){
  const w = WAIVER_MAP[normName(p.name)];
  if (w){
    // The curated pickup must be validated by the market — if nobody is
    // adding him, he's trash or already gone; fall through to the fallback.
    const live = pickupsOf(w).filter(n => trendingNames.has(normName(n)));
    if (live.length){
      return `<div class="waiver"><div class="wl">⚡ Waiver target${live.length>1?"s":""}</div>` +
        live.map(n=>`<div class="wp">${badgeNames(n)}</div>`).join("") +
        `<div class="wn">${esc(w.note)}</div></div>`;
    }
  }
  // Fallback: same team + same position trending adds only.
  // A backup worth adding plays for the same team as the injured guy —
  // league-wide trending WRs are noise on an unrelated injury.
  const same = trending
    .map(t => ({ info: players[t.player_id], count: t.count }))
    .filter(x => x.info && x.info.pos === p.pos && x.info.team && x.info.team === p.team
      && normName(x.info.name) !== normName(p.name))
    .slice(0, 2);
  if (!same.length) return "";
  const names = same.map(x =>
    `<div class="wp">${esc(x.info.name)} <span style="color:var(--muted);font-weight:400">· ${esc(x.info.team||"FA")}</span></div>
     <div class="wn">+${Number(x.count).toLocaleString()} adds in 24h — same team, same position.</div>`
  ).join("");
  return `<div class="waiver"><div class="wl">🔥 Trending ${esc(p.team)} ${esc(p.pos)} adds</div>${names}</div>`;
}
// Manual hide: viewer sees a player active in-game but the API still lists
// them as hurt. Tapping hide removes them; any fresh status change clears it.
let hidden = {};
try{ hidden = JSON.parse(localStorage.getItem("ww_hidden") || "{}"); }catch(e){}
(function pruneHidden(){
  const now = Date.now();
  let dirty = false;
  for (const id in hidden) if (now - hidden[id] > 24*3600*1000){ delete hidden[id]; dirty = true; }
  if (dirty) try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){}
})();

function hideKey(p){ return p.id || ("name:" + normName(p.name)); }
function isHidden(p){ return hidden[hideKey(p)] || (p.id && hidden["name:" + normName(p.name)]); }

function titleCase(s){ return (s||"").split(" ").map(w=>w? w[0].toUpperCase()+w.slice(1):w).join(" "); }
function statusRank(s){ return /IR|PUP/i.test(s) ? 0 : /OUT/i.test(s) ? 1 : /DOUBTFUL/i.test(s) ? 2 : 3; }
// Waiver driver scoring: severity × recency, summed across every contributing
// injury. A recent secondary (Bigsby) compounds the ranking; a stale one
// (Brown's weeks-old IR) is mentioned but scores zero.
const STALE_DRIVERS = new Set(["a.j. brown"]);
function driverWeight(h){
  if (STALE_DRIVERS.has(normName(h.name))) return 0;
  const sevW = /IR|PUP/i.test(h.status) ? 4 : /OUT/i.test(h.status) ? 3 : /DOUBTFUL/i.test(h.status) ? 2 : 1;
  const ageH = (Date.now() - (h.news_updated || 0)) / 3600000;
  const recW = ageH < 48 ? 1 : ageH < 96 ? 0.5 : ageH < 120 ? 0.25 : 0;
  return sevW * recW;
}

// Reverse index: pickup name -> whose injury is driving the adds.
const PICKUP_CONTEXT = {};
for (const k of Object.keys(WAIVER_MAP)){
  const w = WAIVER_MAP[k];
  for (const name of pickupsOf(w)){
    const pk = normName(name);
    (PICKUP_CONTEXT[pk] = PICKUP_CONTEXT[pk] || []).push({ injured: k, note: w.note });
  }
}

function injuryContextFor(p){
  const pk = normName(p.name);
  if (PICKUP_CONTEXT[pk]){
    const c = PICKUP_CONTEXT[pk][0];
    return "⚡ " + titleCase(c.injured) + " fill-in — " + c.note;
  }
  // All hurt teammates at the same position — derived live, so every player
  // in a banged-up unit gets the full picture with zero manual upkeep.
  const hurt = Object.values(players).filter(x =>
    x.team && x.team === p.team && x.pos === p.pos && x.status && !isStaleTag(x) &&
    /OUT|IR|DOUBTFUL|PUP|SUSP|QUESTIONABLE/i.test(x.status) && normName(x.name) !== pk);
  if (hurt.length){
    hurt.sort((a,b) => (statusRank(a.status) - statusRank(b.status)) || (relevance(a) - relevance(b)));
    return "🏥 With " + hurt.slice(0, 3).map(h => h.name + " (" + shortStatus(h.status) + ")").join(" & ");
  }
  return "📈 Breakout / role bump — the crowd is buying";
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// Auto-generate "this week" stories from significant status changes detected
// in the last 7 days. No manual updates needed — the feed writes itself.
function autoWeekStories(){
  // Week-based: only show changes from the CURRENT week. When WEEK_NUM rolls
  // over, this resets automatically — no backfilling old injuries.
  const weekStart = SEASON_START + (WEEK_NUM - 1) * 7*24*3600*1000;
  const badTo = ["OUT","IR","DOUBTFUL","PUP","SUSP"];
  const seen = {};
  const out = [];
  for (const c of changes){
    if (c.t < weekStart || seen[c.id]) continue;
    if (isChangeStale(c)) continue;
    if (c.news){
      // Fresh news on an already-hurt player (e.g. "unlikely to play") —
      // treat as a story if the status is serious.
      const stUp = (c.status||"").toUpperCase();
      if (!badTo.some(k=>stUp.includes(k)) && !stUp.includes("QUESTIONABLE")) continue;
      seen[c.id] = 1;
      out.push(c);
      continue;
    }
    const toUp = (c.to||"").toUpperCase();
    const fromUp = (c.from||"").toUpperCase();
    const worsened = badTo.some(k=>toUp.includes(k)) ||
      (toUp.includes("QUESTIONABLE") && !fromUp.includes("QUESTIONABLE"));
    if (!worsened) continue;
    seen[c.id] = 1;
    out.push(c);
  }
  out.sort((a,b)=>{
    const ra = players[a.id] ? relevance(players[a.id]) : 99999;
    const rb = players[b.id] ? relevance(players[b.id]) : 99999;
    return ra - rb;
  });
  return out.slice(0,6);
}

/* ============ YAHOO (optional, per-visitor) ============ */
// Connects the visitor's own Yahoo fantasy account so waiver targets show
// whether each player is actually on THEIR league's wire. Tokens live only
// in this browser's localStorage. Inert until YAHOO_WORKER is configured.
const normYahoo = n => (n || "").toLowerCase().replace(/\./g, "").trim();
let yahooAvailable = new Set();   // normalized names on the visitor's wire
let yahooLeagueName = "";

function yahooConnected(){
  try{ return !!JSON.parse(localStorage.getItem("ww_yahoo") || "null"); }
  catch(e){ return false; }
}

// OAuth callback landed with tokens in the URL fragment — capture & clear.
(function yahooCapture(){
  const h = location.hash || "";
  if (h.includes("yahoo_access_token")){
    const ps = new URLSearchParams(h.slice(1));
    const access = ps.get("yahoo_access_token"), refresh = ps.get("yahoo_refresh_token");
    if (access) localStorage.setItem("ww_yahoo",
      JSON.stringify({ access, refresh, exp: Date.now() + 3600 * 1000 }));
    history.replaceState(null, "", location.pathname + location.search);
  }
})();

async function yahooFetch(path, opts = {}) {
  const tok = JSON.parse(localStorage.getItem("ww_yahoo") || "null");
  if (!tok) throw new Error("not connected");
  const call = access => fetch(YAHOO_WORKER + path, {
    ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + access },
  });
  let r = await call(tok.access);
  if (r.status === 401 && tok.refresh) {
    const rr = await fetch(YAHOO_WORKER + "/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: tok.refresh }),
    });
    const nt = await rr.json().catch(() => ({}));
    if (nt.access_token) {
      const next = { access: nt.access_token, refresh: nt.refresh_token || tok.refresh, exp: Date.now() + 3600 * 1000 };
      localStorage.setItem("ww_yahoo", JSON.stringify(next));
      r = await call(next.access);
    }
  }
  return r;
}

async function yahooSync() {
  try {
    const lr = await yahooFetch("/api/leagues");
    const leagues = (await lr.json()).leagues || [];
    if (!leagues.length) return;
    yahooLeagueName = leagues[0].name || "";
    const fr = await yahooFetch("/api/freeagents?league_key=" + encodeURIComponent(leagues[0].league_key));
    const fj = await fr.json();
    yahooAvailable = new Set((fj.available || []).map(p => normYahoo(p.name != null ? p.name : p)));
  } catch (e) { /* stay in public mode */ }
  updateYahooBtn();
  render();
}

function updateYahooBtn() {
  const b = $("yahooBtn");
  if (!YAHOO_WORKER) { b.style.display = "none"; return; }
  b.style.display = "";
  b.textContent = yahooConnected()
    ? `✅ Yahoo connected${yahooLeagueName ? " · " + yahooLeagueName : ""} — tap to disconnect`
    : "🔗 Connect Yahoo — your league's actual wire";
}

// ✅ / ❌ availability badge for a possibly "A / B"-joined name string.
function badgeNames(joined) {
  if (!yahooConnected() || !yahooAvailable.size) return esc(joined);
  return String(joined).split(" / ").map(n => {
    const ok = yahooAvailable.has(normYahoo(n));
    return esc(n) + (ok ? ' <span title="On your waiver wire">✅</span>'
                        : ' <span title="Rostered in your league">❌</span>');
  }).join(" / ");
}

function render(){
  try { renderInner(); }
  catch(e){ listEl.innerHTML = `<div class="empty">Couldn't draw this view — tap ⟳ to retry.<br><span style="opacity:.6">${esc(e.message || e)}</span></div>`; }
}
function renderInner(){
  const q = query.toLowerCase();
  let html = "";
  if (filter === "CHANGES"){
    // Latest = all injured players, strictly chronological by most recent

    const lv = window._latestView || "relevant";
    html += `<h2>⚡ Latest Updates</h2>
      <div style="display:flex;gap:8px;margin:0 2px 10px">
        <button class="tab ${lv==="relevant"?"active":""}" data-lv="relevant" style="font-size:12px;padding:6px 12px">🎯 Waiver-relevant</button>
        <button class="tab ${lv==="all"?"active":""}" data-lv="all" style="font-size:12px;padding:6px 12px">📋 All</button>
      </div>
      <div class='pmeta' style='margin:0 2px 10px;opacity:.75'>Most recent first · refreshes every 90s.</div>`;
    const wq = query.toLowerCase();
    let arr = Object.values(players).filter(p =>
      POSITIONS.includes(p.pos) && p.status && !SKIP_STATUS.has(p.status) &&
      (!wq || p.name.toLowerCase().includes(wq)) && !isHidden(p) && !isStaleTag(p));
    // 14-day freshness — same as browse tabs
    arr = arr.filter(p => p.news_updated && (Date.now() - p.news_updated) < 14*24*3600*1000);
    // Waiver-relevant: has a curated pickup or trending same-team adds
    if (lv === "relevant") arr = arr.filter(p => waiverFor(p));
    // Strictly chronological: most recently updated first
    arr.sort((a, b) => (b.news_updated || 0) - (a.news_updated || 0));
    html += arr.length ? arr.slice(0, 80).map(p => {
      const isNew = changes.length && changes[0].id && String(changes[0].id) === String(p.id) &&
        (Date.now() - changes[0].t) < 10*60*1000;
      // Check if this player has a recent change entry to show what happened
      const ch = changes.find(c => String(c.id) === String(p.id));
      const activity = ch
        ? (ch.news ? `📰 News update` : `${esc(ch.from)} → <b>${esc(ch.to)}</b>`)
        : null;
      return `<div class="card${isNew ? " new" : ""}">
        <div class="row1"><div><div class="pname">${esc(p.name)}</div>
        <div class="pmeta">${esc(p.pos)} · ${esc(p.team || "FA")}${p.injury_part ? " · " + esc(p.injury_part) : ""}</div></div>
        <span class="badge ${badgeClass(p.status)}">${esc(shortStatus(p.status))}</span>
        <button class="hidebtn" data-hide="${esc(hideKey(p))}" title="Hide — I see him playing">✕</button></div>
        ${p.injury_notes ? `<div class="inj">${esc(p.injury_notes)}</div>` : ""}
        <div class="pmeta" style="margin-top:4px;opacity:.8">${activity ? activity + " · " : ""}Updated ${timeAgo(p.news_updated)}</div>
        ${(() => { const pn = newsForPlayer(p.name);
          return pn.length ? `<button class="newstoggle" data-news="${esc(p.id)}" style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 0;cursor:pointer">📰 ${pn.length} recent headline${pn.length > 1 ? "s" : ""} ▾</button>
          <div class="newsbody" id="nb-${esc(p.id)}" style="display:none;margin-top:4px">${pn.map(a =>
            `<div style="padding:8px 0;border-top:1px solid #1e293b"><div style="font-size:13px;font-weight:600">${esc(a.headline)}</div>
             <div style="font-size:12px;color:var(--muted);margin-top:2px">${a.desc ? esc(a.desc.slice(0, 120)) + (a.desc.length > 120 ? "…" : "") + " · " : ""}${timeAgo(a.published)}</div></div>`
          ).join("")}</div>` : ""; })()}
        ${waiverFor(p)}</div>`;
    }).join("") : `<div class="empty">No injuries right now. 🎉</div>`;
  } else if (filter === "NEWS"){
    html += "<h2>📰 NFL News Wire</h2>";
    html += "<div class='pmeta' style='margin:0 2px 10px;opacity:.75'>Injury-relevant headlines · last 24 hours · refreshes every 90s.</div>";
    // Filter to injury-relevant news only — this is an injury wire, not ESPN.com
    // Deduplicate: same story from multiple reporters (e.g. retirement reported 3 ways)
    const seen = new Set();
    const items = [...nflNews]
      .map(a => ({ a, s: injuryScore(a) }))
      .filter(x => x.s > 0)
      .sort((x, y) => (y.s - x.s) || (y.a.published - x.a.published))
      .filter(x => {
        // Dedup key: first 5 significant words of headline
        const key = normName(x.a.headline).split(" ").filter(w => w.length > 3).slice(0, 5).join(" ");
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      })
      .slice(0, 30);
    html += items.length ? items.map(({a})=>{
      const pub = timeAgo(a.published);
      const open = a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">` : "";
      const close = a.link ? "</a>" : "";
      return `<div class="card" style="margin-bottom:10px">
        ${open}<div style="font-size:15px;font-weight:700;line-height:1.4">${esc(a.headline)}</div>${close}
        ${a.desc ? `<div style="font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px">${esc(a.desc.slice(0,160))}${a.desc.length>160?"…":""}</div>` : ""}
        <div style="font-size:12px;color:var(--muted);margin-top:8px;opacity:.7"><time>${pub}</time></div>
      </div>`;
    }).join("") : `<div class="empty">No injury news right now.<br>Quiet wire — check back soon.</div>`;
  } else if (filter === "TRENDING"){
    const wv = window._waiverView || "top";
    html += `<h2>🎯 Top waiver targets</h2>
      <div style="display:flex;gap:8px;margin:0 2px 10px">
        <button class="tab ${wv==="top"?"active":""}" data-wv="top" style="font-size:12px;padding:6px 12px">📈 Top adds</button>
        <button class="tab ${wv==="smart"?"active":""}" data-wv="smart" style="font-size:12px;padding:6px 12px">🧠 Smart picks</button>
      </div>`;
    if (wv === "top") {
      // Pure volume: top trending by 24h adds, no logic
      html += "<div class='pmeta' style='margin:0 2px 10px;opacity:.75'>Most-added players in the last 24h, straight from Sleeper.</div>";
      const top = [...trending].slice(0, 25);
      html += top.map((t, i) => {
        const p = players[t.player_id] || {};
        if (!p.name || !POSITIONS.includes(p.pos)) return "";
        const ctx = injuryContextFor(p);
        return `<div class="card"><div class="row1"><div><div class="pname"><span style="color:var(--muted)">#${i+1}</span> ${badgeNames(p.name)}</div>
          <div class="pmeta">${esc(p.pos)} · ${esc(p.team||"FA")}</div></div>
          <span class="adds" style="color:var(--green);font-weight:800">+${Number(t.count).toLocaleString()}</span></div>
          <div class="inj" style="margin-top:4px;opacity:.8">${esc(ctx)}</div></div>`;
      }).join("");
      // Deeper adds section still shows below
    } else {
    html += "<div class='pmeta' style='margin:0 2px 10px;opacity:.75'>Fresh injury-driven pickups first, then who's hot in the last 24h.</div>";
    const seen = new Set();
    const cards = [];
    const findByName = n => {
      const k = normName(n);
      return Object.values(players).find(p => normName(p.name) === k);
    };
    // Availability: normalized names with active add volume in the last 24h.
    // A curated pickup nobody is adding is already rostered — don't recommend him.
    const trendingCounts = {};
    for (const t of trending){
      const p = players[t.player_id];
      if (p) trendingCounts[normName(p.name)] = t.count;
    }
    // 1. Injury-driven targets from the curated map — fresh news only (5d),
    // ranked by severity first, then recency, then relevance. Last week's news is done.
    const FRESH_MS = 5*24*3600*1000;
    const hurt = Object.values(players)
      .filter(p => p.status && /OUT|IR|DOUBTFUL|PUP|QUESTIONABLE/i.test(p.status) && POSITIONS.includes(p.pos) && !isHidden(p)
        && !isStaleTag(p) && p.news_updated && (Date.now() - p.news_updated) < FRESH_MS)
      .sort((a,b) => (statusRank(a.status) - statusRank(b.status)) || (b.news_updated - a.news_updated) || (relevance(a) - relevance(b)));
    // Group curated pickups: every contributing injury scores (severity × recency)
    // and the scores compound. The lead driver is the highest-weight injury.
    // Top section requires real market validation (50k+ adds) — a severe injury
    // with no one's adding the backup doesn't belong up here.
    const byPickup = new Map();
    for (const h of hurt){
      const w = WAIVER_MAP[normName(h.name)];
      if (!w) continue;
      const dw = driverWeight(h);
      for (const name of pickupsOf(w)){
        const pk = normName(name);
        if (!trendingNames.has(pk) || seen.has(pk)) continue;
        if ((trendingCounts[pk] || 0) < 50000) continue;
        let e = byPickup.get(pk);
        if (!e){ e = { w, name, adds: trendingCounts[pk] || 0, score: 0, drivers: [], lead: null, leadW: -1 }; byPickup.set(pk, e); }
        e.score += dw;
        e.drivers.push(h);
        if (dw > e.leadW || (dw === e.leadW && (h.news_updated || 0) > (e.lead.news_updated || 0))){
          e.lead = h; e.leadW = dw;
        }
      }
    }
    // Talent flag: players the market loves but who haven't shown they're good.
    // Caps FAAB — opportunity without talent is a trap. Add names as Kenny calls them.
    const LOW_TALENT = new Set(["dohnte meyers"]);
    // FAAB tier: role clarity + duration + market validation + talent (proxied by adds).
    // Returns {label, pct} — pct is % of FAAB budget to bid.
    // IMPORTANT: tier is driven by the LEAD injury (the starter who's out),
    // not the compounded score. A backup's IR doesn't 2x the value — the
    // starter's status is what creates the role. Secondaries are context.
    function faabTier({ leadWeight, adds, leadStatus, isBreakout, tier, pos, name }) {
      // Talent check first: if flagged as low-talent, cap at flier regardless
      if (name && LOW_TALENT.has(normName(name))) return { label: "🟢 Flier", pct: 5 };
      const st = (leadStatus || "").toUpperCase();
      const isIR = st.includes("IR") || st.includes("PUP");
      const isOut = st === "OUT";
      // Duration proxy: IR = multi-week, OUT = 1-3 weeks, Q/D = maybe 1 week
      const longRunway = isIR;
      const medRunway = isOut;
      const isRB = (pos || "").toUpperCase() === "RB";
      if (!isBreakout) {
        // Injury-driven: leadWeight is the starter's injury severity × recency.
        // Duration matters: a 1-2 week rental (OUT, not IR) caps lower than a
        // multi-week runway (IR). RBs price higher than WRs (scarcity).
        if (leadWeight >= 4 && adds >= 200000 && longRunway) return { label: "🔴 Must-add", pct: 25 };
        if (leadWeight >= 4 && adds >= 200000) return { label: "🔴 Must-add", pct: 20 };
        if (leadWeight >= 3 && adds >= 200000 && longRunway) return { label: "🔴 Must-add", pct: 20 };
        if (leadWeight >= 3 && adds >= 200000) return { label: "🟡 Strong add", pct: isRB ? 15 : 12 };
        if (leadWeight >= 3 && adds >= 100000 && (longRunway || medRunway)) return { label: "🟡 Strong add", pct: isRB ? 15 : 10 };
        if (adds >= 50000) return { label: "🟡 Strong add", pct: 10 };
        return { label: "🟢 Flier", pct: 5 };
      } else {
        // Breakout (performance-driven, no injury)
        if (adds >= 500000) return { label: "🟡 Strong add", pct: 15 };
        if (adds >= 200000) return { label: "🟡 Strong add", pct: 10 };
        if (adds >= 50000) return { label: "🟢 Flier", pct: 5 };
        return { label: "⚪ Watch", pct: 0 };
      }
    }
    const drivers = [...byPickup.values()]
      .filter(e => e.score > 0)
      .map(e => {
        const pl0 = findByName(e.name) || {};
        return { ...e, _faab: faabTier({ leadWeight: e.leadW, adds: e.adds, leadStatus: e.lead.status, isBreakout: false, pos: pl0.pos, name: e.name }) };
      })
      .sort((a,b) => (b._faab.pct - a._faab.pct) || (b.score - a.score) || (b.adds - a.adds) || ((b.lead.news_updated || 0) - (a.lead.news_updated || 0)))
      .slice(0, 6);
    // Tier 1b: curated injuries whose pickups are under the 50k top-tier gate —
    // to the bottom, latest first. Real adds, just lower volume.
    const withPickup = new Set([...byPickup.keys()].map(k => k));
    const noPickup = [];
    for (const h of hurt){
      const w = WAIVER_MAP[normName(h.name)];
      if (!w) continue;
      const names = pickupsOf(w);
      if (names.some(n => withPickup.has(normName(n)))) continue;
      if (noPickup.some(x => normName(x.h.name) === normName(h.name))) continue;
      if (drivers.some(d => normName(d.lead.name) === normName(h.name))) continue;
      noPickup.push({ h, w, names });
    }
    noPickup.sort((a,b) => ((b.h.news_updated || 0) - (a.h.news_updated || 0)));
    for (const e of drivers){
      const pk = normName(e.name);
      seen.add(pk);
      const pl = findByName(e.name) || {};
      const cnt = trendingCounts[pk];
      const h = e.lead;
      // Secondary context: other contributing injuries, mentioned but not re-ranked.
      const seenD = new Set([normName(h.name)]);
      const secondary = [];
      for (const o of e.drivers.slice().sort((a,b) => driverWeight(b) - driverWeight(a) || ((b.news_updated || 0) - (a.news_updated || 0)))){
        const k = normName(o.name);
        if (seenD.has(k)) continue;
        seenD.add(k);
        secondary.push(o.name + " (" + shortStatus(o.status) + ")");
        if (secondary.length >= 2) break;
      }
      const faab = e._faab;
      cards.push({ name: e.name, pos: pl.pos || "", team: pl.team || "",
        count: cnt ? Number(cnt).toLocaleString() : null,
        faab: faab,
        ctx: "⚡ " + h.name + " (" + shortStatus(h.status) + ")" + (secondary.length ? " + " + secondary.join(" + ") : "") + " — " + e.w.note });
    }
    // 2. Trending fills the rest — tiered by conviction, not raw hype:
    //    tier 0 = curated pickup (analyst + crowd agree)
    //    tier 1 = real injury situation behind the adds
    //    tier 2 = pure hype (no injury link)
    const fillers = [];
    for (const t of trending){
      if (seen.size >= 24) break; // collect enough to tier-sort
      const p = players[t.player_id];
      if (!p || !POSITIONS.includes(p.pos)) continue;
      if (seen.has(normName(p.name))) continue;
      if (q && !p.name.toLowerCase().includes(q)) continue;
      seen.add(normName(p.name));
      let ctx = injuryContextFor(p);
      // Breakout boost: healthy player + very fresh news + real add volume
      // (e.g. Monday night 3-TD game — adds lag the performance).
      const newsAgeH = (Date.now() - (p.news_updated || 0)) / 3600000;
      const isBreakout = !p.status && newsAgeH < 6 && (Number(t.count) || 0) > 50000;
      if (isBreakout && ctx.startsWith("📈")) ctx = "🔥 Breakout — fresh news, heavy adds";
      const tier = PICKUP_CONTEXT[normName(p.name)] ? 0 : (ctx.startsWith("📈") ? 2 : 1);
      const ffaab = faabTier({ leadWeight: 0, adds: Number(t.count) || 0, leadStatus: "", isBreakout: true, tier, pos: p.pos, name: p.name });
      fillers.push({ name: p.name, pos: p.pos, team: p.team || "FA",
        count: Number(t.count).toLocaleString(), countNum: Number(t.count) || 0,
        faab: ffaab, ctx, tier });
    }
    fillers.sort((a,b) => (a.tier - b.tier) || (b.countNum - a.countNum));
    for (const f of fillers){
      if (cards.length >= 24) break;
      cards.push(f);
    }
    // Merge injuries + breakouts: sort ALL by FAAB% high to low.
    // A breakout like Brian Robinson (3 TDs, 383k adds) competes with
    // injury pickups — not just filler underneath.
    cards.sort((a, b) => ((b.faab || {}).pct || 0) - ((a.faab || {}).pct || 0));
    cards.length = Math.min(cards.length, 12);
    html += cards.length ? cards.map((c, i)=>
      `<div class="card">
        <div class="row1"><div><div class="pname"><span style="color:var(--muted)">#${i+1}</span> ${badgeNames(c.name)}</div>
        <div class="pmeta">${esc(c.pos)}${c.pos && c.team ? " · " : ""}${esc(c.team)}</div></div>
        <div style="text-align:right">${c.count ? `<span class="adds" style="color:var(--green);font-weight:800">+${c.count}</span>` : ""}${c.faab && c.faab.pct > 0 ? `<div style="font-size:11px;color:var(--accent);font-weight:700;margin-top:2px">${esc(c.faab.label)} · ${c.faab.pct}%</div>` : ""}</div></div>
        <div class="inj">${esc(c.ctx)}</div></div>`
    ).join("") : `<div class="empty">Loading waiver targets…</div>`;
    if (noPickup.length){
      html += `<h2 style="margin-top:18px">📰 More injuries — deeper adds</h2>`;
      // Flatten pickups and sort by add volume (ones with adds first)
      const flat = [];
      noPickup.slice(0, 8).forEach(({ h, w, names }) => {
        names.forEach(n => {
          flat.push({ h, w, n, c: trendingCounts[normName(n)] || 0 });
        });
      });
      flat.sort((a, b) => b.c - a.c);
      html += flat.map(({ h, w, n, c }) => {
          const pl = findByName(n) || {};
          const hasAdds = c > 0;
          const adds = hasAdds ? `+${Number(c).toLocaleString()} adds in 24h` : `No adds yet — likely available`;
          const reason = `${h.name} (${shortStatus(h.status)})`;
          const header = hasAdds
            ? `🔥 Trending ${esc(pl.team||"")} ${esc(pl.pos||"")} adds`
            : `💤 Deep watch ${esc(pl.team||"")} ${esc(pl.pos||"")}`;
          return `<div class="card" style="border:1px dashed var(--accent);">
            <div style="color:var(--accent);font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase">${header}</div>
            <div class="pname" style="margin-top:6px">${esc(n)} <span style="color:var(--muted);font-weight:400">· ${esc(pl.team||"")}</span></div>
            <div class="pmeta" style="margin-top:4px">${adds} — ${esc(reason)}</div></div>`;
      }).join("");
    }
    } // end smart view else
  } else {
    let arr = Object.values(players).filter(p =>
      POSITIONS.includes(p.pos) && p.status && !SKIP_STATUS.has(p.status) && !isHidden(p) && !isStaleTag(p));
    // Browsing shows the last 14 days of injury news — older than that isn't actionable.
    // Searching digs through everything.
    if (!q){
      const BROWSE_FRESH_MS = 14*24*3600*1000;
      arr = arr.filter(p => p.news_updated && (Date.now() - p.news_updated) < BROWSE_FRESH_MS);
    }
    if (filter !== "ALL") arr = arr.filter(p => p.pos === filter);
    if (q) arr = arr.filter(p => p.name.toLowerCase().includes(q));
    arr.sort((a,b)=> relevance(a)-relevance(b));
    const byRecent = (a,b) => (b.news_updated||0) - (a.news_updated||0);
    const bad = arr.filter(p=>["OUT","IR","PUP","DOUBTFUL"].some(k=>p.status.toUpperCase().includes(k))).sort(byRecent);
    const ques = arr.filter(p=>p.status.toUpperCase().includes("QUESTIONABLE")).sort(byRecent);
    const other = arr.filter(p=>!bad.includes(p)&&!ques.includes(p)).sort(byRecent);
    const groups = [["⛔ Out / IR / Doubtful",bad],["❓ Questionable",ques],["ℹ️ Other",other]];
    for (const [title, g] of groups){
      if (!g.length) continue;
      html += `<h2>${title} (${g.length})</h2>`;
      html += g.slice(0,80).map(p=>{
        const isNew = changes.length && changes[0].id && String(changes[0].id)===String(p.id) &&
          (Date.now()-changes[0].t) < 10*60*1000;
        return `<div class="card${isNew?" new":""}">
          <div class="row1"><div><div class="pname">${esc(p.name)}</div>
          <div class="pmeta">${esc(p.pos)} · ${esc(p.team||"FA")}${p.injury_part? " · "+esc(p.injury_part):""}</div></div>
          <span class="badge ${badgeClass(p.status)}">${esc(shortStatus(p.status))}</span>
          <button class="hidebtn" data-hide="${esc(hideKey(p))}" title="Hide — I see him playing">✕</button></div>
          ${p.injury_notes?`<div class="inj">${esc(p.injury_notes)}</div>`:""}
          ${p.news_updated?`<div class="pmeta" style="margin-top:2px;opacity:.7">Status updated ${timeAgo(p.news_updated)}</div>`:""}
          ${(()=>{ const pn = newsForPlayer(p.name);
            return pn.length ? `<button class="newstoggle" data-news="${esc(p.id)}" style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 0;cursor:pointer">📰 ${pn.length} recent headline${pn.length>1?"s":""} ▾</button>
            <div class="newsbody" id="nb-${esc(p.id)}" style="display:none;margin-top:4px">${pn.map(a=>
              `<div style="padding:8px 0;border-top:1px solid #1e293b"><div style="font-size:13px;font-weight:600">${esc(a.headline)}</div>
               <div style="font-size:12px;color:var(--muted);margin-top:2px">${a.desc?esc(a.desc.slice(0,120))+(a.desc.length>120?"…":"")+" · ":""}${timeAgo(a.published)}</div></div>`
            ).join("")}</div>` : ""; })()}
          ${waiverFor(p)}</div>`;
      }).join("");
    }
    if (!arr.length) html = `<div class="empty">No injuries match. 🎉</div>`;
  }
  const hiddenCount = Object.keys(hidden).length;
  if (hiddenCount) html = `<div class="pmeta" style="margin:4px 2px 8px;opacity:.8">${hiddenCount} hidden by you · <a href="#" id="restoreHidden" style="color:var(--accent)">restore</a></div>` + html;
  listEl.innerHTML = html;
}

let lastOk = 0;
async function refresh(manual){
  try{
    if (manual) statusEl.textContent = "Pulling latest…";
    const [pd, tr, sb, nw] = await Promise.all([fetchPlayers(), fetchTrending(), fetchScoreboard(), fetchNews()]);
    const next = {};
    for (const id in pd){
      const p = pd[id];
      if (!p || !POSITIONS.includes(p.position)) continue;
      next[id] = { id, name: p.full_name || (p.first_name+" "+p.last_name),
        pos: p.position, team: p.team || "", status: p.injury_status || "",
        injury_part: p.injury_body_part || "", injury_notes: p.injury_notes || "",
        news_updated: p.news_updated || 0,
        search_rank: p.search_rank || 99999 };
    }
    detectChanges(next);
    players = next; trending = tr || [];
    if (nw && nw.length) nflNews = nw;
    teamGameEnd = sb || {};
    trendingNames = new Set();
    for (const t of trending){
      const p = players[t.player_id];
      if (p) trendingNames.add(normName(p.name));
    }
    lastOk = Date.now();
    statusEl.innerHTML = `<span class="dot"></span> Live · updated ${timeAgo(lastOk)} · checks every 90s`;
    render();
  }catch(e){
    statusEl.textContent = lastOk ? `Live · last good update ${timeAgo(lastOk)} · retrying…`
                                  : "Couldn't reach injury feed — retrying…";
  }
}

$("tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.remove("active"));
  b.classList.add("active"); filter = b.dataset.f; render();
});
// Waiver sub-view toggle (Smart picks vs Top adds)
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-wv]"); if(!b) return;
  window._waiverView = b.dataset.wv; render();
});
// Latest tab toggle (Waiver-relevant vs All)
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-lv]"); if(!b) return;
  window._latestView = b.dataset.lv; render();
});
listEl.addEventListener("click", e=>{
  const hb = e.target.closest("[data-hide]");
  if (hb){
    hidden[hb.dataset.hide] = Date.now();
    try{ localStorage.setItem("ww_hidden", JSON.stringify(hidden)); }catch(e){}
    render();
    return;
  }
  const nt = e.target.closest("[data-news]");
  if (nt){
    const body = document.getElementById("nb-" + nt.dataset.news);
    if (body){
      const open = body.style.display === "none";
      body.style.display = open ? "block" : "none";
      nt.innerHTML = nt.innerHTML.replace(open ? "▾" : "▴", open ? "▴" : "▾");
    }
    return;
  }
  if (e.target.closest("#restoreHidden")){
    e.preventDefault();
    hidden = {};
    try{ localStorage.setItem("ww_hidden", "{}"); }catch(e){}
    render();
  }
});
$("search").addEventListener("input", e=>{ query = e.target.value; render(); });
$("refreshBtn").addEventListener("click", ()=>refresh(true));
$("notifyBtn").addEventListener("click", async ()=>{
  if (!("Notification" in window)){ alert("Notifications not supported on this device."); return; }
  if (notifyEnabled && Notification.permission === "granted"){
    notifyEnabled = false;
    try{ localStorage.setItem("ww_notify", "0"); }catch(e){}
    updateNotifyBtn();
    return;
  }
  const perm = await Notification.requestPermission();
  notifyEnabled = perm === "granted";
  try{ localStorage.setItem("ww_notify", notifyEnabled ? "1" : "0"); }catch(e){}
  updateNotifyBtn();
  if (notifyEnabled){
    fireNotify("🔔 Injury alerts on", "You'll get notified when players go Out, IR, or Doubtful.");
    setupPush(); // closed-app push subscription (v78)
  }
});
function updateNotifyBtn(){
  const b = $("notifyBtn"); if (!b) return;
  b.textContent = (notifyEnabled && Notification.permission === "granted")
    ? "🔕 Injury alerts on — tap to disable" : "🔔 Enable injury alerts";
}
updateNotifyBtn();
$("yahooBtn").addEventListener("click", ()=>{
  if (yahooConnected()){
    localStorage.removeItem("ww_yahoo");
    yahooAvailable = new Set(); yahooLeagueName = "";
    updateYahooBtn(); render();
  } else if (YAHOO_WORKER){
    location.href = YAHOO_WORKER + "/auth/start";
  }
});
setInterval(()=>refresh(false), POLL_MS);
setInterval(()=>{ // keep "xm ago" labels fresh
  if (lastOk) statusEl.innerHTML = `<span class="dot"></span> Live · updated ${timeAgo(lastOk)} · checks every 90s`;
}, 15000);
updateYahooBtn();
if (YAHOO_WORKER && yahooConnected()) yahooSync();
refresh(false);
</script>
